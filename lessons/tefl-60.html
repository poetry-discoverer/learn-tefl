<script>window.LESSON_ID="tefl-60";window.STEPS=[{"t": "section", "h": "The reality | الواقع", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to module thirteen, classroom strategy. Unit one: teaching with limited resources.</div><div class=\"u\">أهلًا بيك في الوحدة تلتاشر، استراتيجية الفصل. الوحدة الأولى: التدريس بخامات محدودة.</div>", "a": "tefl-60-001", "x": "68bb54ad", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">There is nothing worse than arriving at your new school, full of enthusiasm and ideas for great hand-outs, only to realise that your school does not have a photocopier!</div><div class=\"u\">مفيش أسوأ من إنك توصل مدرستك الجديدة، مليان حماس وأفكار لأوراق عمل عظيمة، وتكتشف إن مدرستك مافيهاش ماكينة تصوير!</div>", "a": "tefl-60-002", "x": "00fdee0b", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">This has happened to many an EFL teacher, including the writer of this module.</div><div class=\"u\">ده حصل لمدرسين إنجليزي كتير، منهم كاتب الوحدة دي نفسه.</div>", "a": "tefl-60-003", "x": "73f073fa", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">If you are planning on teaching in a developing country, or a very small school, consider the very practical notion of teaching with limited resources.</div><div class=\"u\">لو ناوي تدرّس في دولة نامية، أو مدرسة صغيرة جدًا، فكّر في الفكرة العملية جدًا بتاعة التدريس بخامات محدودة.</div>", "a": "tefl-60-004", "x": "63f8e505", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">What follows are practical ideas and techniques to ensure your students stay engaged and learning, even if all you have is some broken bits of chalk and a blackboard.</div><div class=\"u\">اللي جاي أفكار وتقنيات عملية تضمن إن طلبتك يفضّلوا مشاركين وبيتعلّموا، حتى لو كل اللي معاك شوية طباشير مكسّر وسبورة.</div>", "a": "tefl-60-005", "x": "f70c8e50", "n": 1, "i": 5}, {"t": "section", "h": "A to Z | من الألف للياء", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Activity one: A to Z. A firm favourite with all students, especially large classes not used to getting up and moving around.</div><div class=\"u\">النشاط الأول: من الألف للياء. لعبة محبوبة جدًا من كل الطلبة، خصوصًا الفصول الكبيرة اللي مش متعودة تقوم وتتحرّك في الفصل.</div>", "a": "tefl-60-006", "x": "1ce9cf01", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">Choose a lexical set like sports. The student at the front of each line runs to the board and writes a sport beginning with A.</div><div class=\"u\">اختار مجموعة مفردات زي الرياضات. الطالب اللي في أول كل صف بيجري على السبورة ويكتب رياضة بتبدأ بحرف A.</div>", "a": "tefl-60-007", "x": "bdb5f263", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">They hand the chalk to the student behind them and go to the back of the line. The next student writes a sport beginning with B, and so on until Z.</div><div class=\"u\">بيدّي الطباشير للطالب اللي وراه ويروح آخر الصف. الطالب اللي بعده بيكتب رياضة بتبدأ بحرف B، وهكذا لحد حرف Z.</div>", "a": "tefl-60-008", "x": "0883cd08", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">Teammates can help the writer. If nobody can think of a word, they move to the next letter. The winner is the team with the most words on the board.</div><div class=\"u\">الفريق يقدر يساعد الكاتب. لو محدش فاكر كلمة، بينتقلوا للحرف اللي بعده. الكسبان هو الفريق صاحب أكتر كلمات على السبورة.</div>", "a": "tefl-60-009", "x": "d85b0dbd", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Tip: use large lexical sets: food and drink, jobs, things in the house, countries, parts of the body.</div><div class=\"u\">نصيحة: استخدم مجموعات مفردات كبيرة: الأكل والشرب، الوظايف، الحاجات اللي في البيت، الدول، أجزاء الجسم.</div>", "a": "tefl-60-010", "x": "b374bef4", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Do NOT use limited sets like furniture or musical instruments: they will frustrate all the players.</div><div class=\"u\">ماتستخدمش مجموعات محدودة زي الأثاث أو الآلات الموسيقية: هتزعّل كل اللاعبين.</div>", "a": "tefl-60-011", "x": "168c2f33", "n": 1, "i": 12}, {"t": "section", "h": "Brainstorming | العصف الذهني", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Activity two: brainstorming. A fun, creative strategy for teachers with limited textbook resources. It involves the entire class in a creative project.</div><div class=\"u\">النشاط التاني: العصف الذهني. استراتيجية ممتعة وإبداعية للمدرسين اللي خامات الكتب عندهم محدودة. بتشرك الفصل كله في مشروع إبداعي.</div>", "a": "tefl-60-012", "x": "f45e8a56", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Decide on a theme and write it on the board for the whole class, for example a mountaintop camp-out. Divide the class into two teams.</div><div class=\"u\">حدّد موضوع واكتبه على السبورة للفصل كله، مثلًا تخييم على قمة جبل. اقسِم الفصل لفريقين.</div>", "a": "tefl-60-013", "x": "5cdeb1ce", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Students take turns dashing to the board to write a word or phrase for the story: backpack, climb, struggle, rope, echo, fire.</div><div class=\"u\">الطلبة بيتبادلوا الجري على السبورة يكتبوا كلمة أو عبارة للقصة: شنطة ضهر، تسلّق، معاناة، حبل، صدى، نار.</div>", "a": "tefl-60-014", "x": "e568786b", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Set a time limit, like five minutes. The team with the most words when time ends wins.</div><div class=\"u\">حدّد وقت، زي خمس دقايق. الفريق صاحب أكتر كلمات لما الوقت يخلّص يكسب.</div>", "a": "tefl-60-015", "x": "6ae490b8", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Follow-up: use the brainstormed words and have students craft their own versions of the mountaintop camp-out story.</div><div class=\"u\">تطبيق لاحق: استخدم كلمات العصف الذهني وخلّي الطلبة يكتبوا نسخهم الخاصة من قصة التخييم على قمة الجبل.</div>", "a": "tefl-60-016", "x": "668db953", "n": 1, "i": 18}, {"t": "section", "h": "Advantages and disadvantages | المميزات والعيوب", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Activity three: advantages and disadvantages. A high-energy, fast-paced activity that gets the whole class involved.</div><div class=\"u\">النشاط التالت: المميزات والعيوب. نشاط عالي الطاقة وسريع بيشرك الفصل كله.</div>", "a": "tefl-60-017", "x": "e6614670", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Create an imaginary boundary down the middle of the classroom, with equal students on each side. Divide them into thinkers and runners.</div><div class=\"u\">اعمل حد تخيّلي في نص الفصل، بعدد طلبة متساوي على كل جانب. اقسِمهم لمفكّرين وعدّائين.</div>", "a": "tefl-60-018", "x": "1be584fc", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">Assign advantage to one side and disadvantage to the other. Write subjects on the board: technology, zoos, canned goods.</div><div class=\"u\">خصّص ميزة لجانب وعيب للجانب التاني. اكتب مواضيع على السبورة: التكنولوجيا، حدائق الحيوان، المعلّبات.</div>", "a": "tefl-60-019", "x": "b160595a", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Thinkers come up with words, tell a runner, who dashes to the board and writes them. The team with the most ideas in the time limit wins.</div><div class=\"u\">المفكّرين بيطلّعوا كلمات، يقولوها لعدّاء، يجري على السبورة ويكتبها. الفريق صاحب أكتر أفكار في الوقت يكسب.</div>", "a": "tefl-60-020", "x": "9736ace4", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Follow-up: have students write an essay about the advantages or disadvantages of one subject.</div><div class=\"u\">تطبيق لاحق: خلّي الطلبة يكتبوا مقال عن مميزات أو عيوب موضوع منهم.</div>", "a": "tefl-60-021", "x": "9804f86b", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Fixed furniture? There are always workarounds: take the class outside or use the space at the front of the classroom.</div><div class=\"u\">الأثاث مثبّت؟ دايمًا فيه حلول: اطلع بالفصل برّه أو استخدم المساحة اللي قدّام الفصل.</div>", "a": "tefl-60-022", "x": "f221cd8b", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Do not be discouraged by physical limitations. Enlist your students in finding solutions to these problems.</div><div class=\"u\">ماتتثبّطش من القيود المادية. جنّد طلبتك في إيجاد حلول للمشاكل دي.</div>", "a": "tefl-60-023", "x": "f6c24815", "n": 1, "i": 26}, {"t": "section", "h": "Label the room | تعليم الأوضة", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Activity four: label the room. Use the classroom and everything in it as a learning resource.</div><div class=\"u\">النشاط الرابع: علّم الأوضة. استخدم الفصل وكل حاجة فيه كمصدر تعلّم.</div>", "a": "tefl-60-024", "x": "10e7a8e1", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Cut strips of paper and label them with everything in the classroom: desk, window, door, cupboard.</div><div class=\"u\">اقطع شرايط ورق وعلّمها بكل حاجة في الفصل: مكتب، شباك، باب، دولاب.</div>", "a": "tefl-60-025", "x": "de8fcc92", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Pass the labels out and have students affix them to the correct objects with tape or blue-tack.</div><div class=\"u\">وزّع الملصقات وخلّي الطلبة يلزّقوها على الأشياء الصحيحة بشريط لاصق أو صمغ.</div>", "a": "tefl-60-026", "x": "5e3ce3b1", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Leave the labels up as long as you like: they are helpful reminders that reinforce the word meanings.</div><div class=\"u\">سيّب الملصقات معلّقة ما تحب: دي تذكيرات مفيدة بتثبّت معاني الكلمات.</div>", "a": "tefl-60-027", "x": "ca1e32e8", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">This task is kinaesthetic, great for beginner and elementary learners, and shows your students you like to do things differently.</div><div class=\"u\">المهمة دي حركية، عظيمة للمبتدئين والابتدائيين، وبتورّي طلبتك إنك بتحب تعمل حاجات مختلفة.</div>", "a": "tefl-60-028", "x": "ee3cba83", "n": 1, "i": 32}, {"t": "section", "h": "Posters | البوسترات", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Activity five: create your own poster. Ready-made posters are expensive and not always easy to find.</div><div class=\"u\">النشاط الخامس: اعمل البوستر بتاعك. البوسترات الجاهزة غالية ومش دايمًا سهلة التلاقي.</div>", "a": "tefl-60-029", "x": "7a4c2062", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">All you need are large sheets of paper, even recycled paper with one clean side, plus paint or markers.</div><div class=\"u\">كل اللي محتاجه ورق كبير، حتى ورق معاد تدويره بجانب واحد نضيف، زيادة ألوان أو أقلام ماركر.</div>", "a": "tefl-60-030", "x": "fcdf5593", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Younger students create alphabet posters. Older children create posters with words and pictures representing them.</div><div class=\"u\">الطلبة الصغيرين بيعملوا بوسترات أبجدية. الأطفال الكبار بيعملوا بوسترات بكلمات وصور بتمثّلها.</div>", "a": "tefl-60-031", "x": "e727dac7", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Let students cut pictures from magazines and newspapers and stick them on the matching poster: another language exercise.</div><div class=\"u\">خلّي الطلبة يقصّوا صور من المجلات والجرايد ويلزّقوها على البوستر المناسب: تمرين لغة تاني.</div>", "a": "tefl-60-032", "x": "2b08f8e1", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Family posters are loved: students draw or stick photos and write captions for the images, building language and personal pride.</div><div class=\"u\">بوسترات العيلة محبوبة: الطلبة بيرسموا أو يلزّقوا صور ويكتبوا تعليقات على الصور، بيبنوا لغة واعتزاز شخصي.</div>", "a": "tefl-60-033", "x": "afa14fb0", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Older students can create grammar posters in groups: sample sentences, a rule, or the target language in context. Thai teenagers particularly enjoyed these.</div><div class=\"u\">الطلبة الكبار يقدروا يعملوا بوسترات قواعد في مجموعات: جمل أمثلة، أو قاعدة، أو اللغة المستهدفة في سياق. المراهقين التايلانديين استمتعوا بيها جدًا.</div>", "a": "tefl-60-034", "x": "22164de0", "n": 1, "i": 39}, {"t": "section", "h": "No photocopier | مفيش ماكينة تصوير", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">No photocopier? Teachers with unlimited access often churn out worksheets unnecessarily.</div><div class=\"u\">مفيش ماكينة تصوير؟ المدرسين اللي عندهم وصول مفتوح ليها غالبًا بيطلّعوا أوراق عمل من غير داعٍ.</div>", "a": "tefl-60-035", "x": "ba93505e", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Instead of handing out four or five comprehension questions, dictate each question but jumble up the words.</div><div class=\"u\">بدل ما توزّع أربعة أو خمس أسئلة استيعاب، أمْلي كل سؤال بس خلّب كلماته.</div>", "a": "tefl-60-036", "x": "e6076959", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">For example: away Peter you do why think ran? The students untangle it: why do you think Peter ran away?</div><div class=\"u\">مثال: away Peter you do why think ran؟ الطلبة بيفكّوها: ليه تفتكر بيتر هرب؟</div>", "a": "tefl-60-037", "x": "0121c830", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Another one: recite sentences that, arranged in the proper order, create a story. Students write them down mixed up.</div><div class=\"u\">واحدة تانية: أمْلي جمل لو اترتّبت صح بتكوّن قصة. الطلبة بيكتبوها مخلوطة.</div>", "a": "tefl-60-038", "x": "22241f03", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Then pair students up to arrange the sentences in the proper order and tell the story.</div><div class=\"u\">وبعدين قرّن الطلبة يعيدوا ترتيب الجمل صح ويحكوا القصة.</div>", "a": "tefl-60-039", "x": "ab47ef14", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">Teaching with limited resources pushes you to be more creative, and in the long run makes you a far better teacher.</div><div class=\"u\">التدريس بخامات محدودة بيدفعك تبقى أكثر إبداعًا، وعلى المدى الطويل بيخلّيك مدرس أحسن بكتير.</div>", "a": "tefl-60-040", "x": "7c99b890", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">You will never feel that the success of your lesson hinges on a pile of hand-outs or a book.</div><div class=\"u\">أبدًا مش هتحس إن نجاح درسك متعلّق بكوم أوراق أو كتاب.</div>", "a": "tefl-60-041", "x": "3186b3a9", "n": 1, "i": 47}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">limited resources: teaching with few materials or tools.</div><div class=\"u\">الخامات المحدودة: التدريس بأدوات ومواد قليلة.</div>", "a": "tefl-60-042", "x": "ea9ac058", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">lexical set: a group of words from one topic.</div><div class=\"u\">مجموعة المفردات: مجموعة كلمات من موضوع واحد.</div>", "a": "tefl-60-043", "x": "056de867", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">brainstorming: collecting many ideas quickly as a class.</div><div class=\"u\">العصف الذهني: تجميع أفكار كتير بسرعة كفصل.</div>", "a": "tefl-60-044", "x": "5b98a868", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">thinkers and runners: idea-makers paired with board-writers.</div><div class=\"u\">المفكّرين والعدّائين: أصحاب الأفكار مع كتبة السبورة.</div>", "a": "tefl-60-045", "x": "dc95f214", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">label the room: sticking word cards on classroom objects.</div><div class=\"u\">تعليم الأوضة: لزق كروت الكلمات على أشياء الفصل.</div>", "a": "tefl-60-046", "x": "105817c9", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">workaround: a clever solution around a limitation.</div><div class=\"u\">الحل البديل: حل ذكي يلفّ حوالين القيد.</div>", "a": "tefl-60-047", "x": "3b6c7f6a", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">recycled paper: used paper with one clean side.</div><div class=\"u\">الورق المعاد تدويره: ورق مستعمل بجانب نضيف.</div>", "a": "tefl-60-048", "x": "2908e49c", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">grammar poster: a student-made poster explaining a rule.</div><div class=\"u\">بوستر القواعد: بوستر من الطلبة بيشرح قاعدة.</div>", "a": "tefl-60-049", "x": "67f2bddc", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">jumbled dictation: dictated sentences with mixed-up words.</div><div class=\"u\">الإملاء المخلوط: جمل مملية بكلمات مبهدلة.</div>", "a": "tefl-60-050", "x": "60344e54", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">hand-out: a printed worksheet given to students.</div><div class=\"u\">ورقة العمل: ورقة مطبوعة بتتوزّع على الطلبة.</div>", "a": "tefl-60-051", "x": "440756c2", "n": 1, "i": 58}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Limited resources are normal: a blackboard and chalk are enough if you have the right activities.</div><div class=\"u\">الخامات المحدودة طبيعية: سبورة وطباشير كفاية لو عندك الأنشطة الصح.</div>", "a": "tefl-60-052", "x": "80fddd70", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Move the class: A-Z races, team brainstorming, and thinkers-and-runners advantages games need only a board.</div><div class=\"u\">حرّك الفصل: سباقات الألف للياء والعصف الذهني الجماعي وألعاب المميزات والعيوب محتاجة بس سبورة.</div>", "a": "tefl-60-053", "x": "b3895216", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Make the room the material: label every object, and build alphabet, family and grammar posters from paper and magazines.</div><div class=\"u\">خلّي الأوضة هي الخامة: علّم كل حاجة، واعمل بوسترات أبجدية وعائلية وقواعد من ورق ومجلات.</div>", "a": "tefl-60-054", "x": "9901633e", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Replace the photocopier: dictate jumbled questions and mixed-up story sentences for students to untangle in pairs.</div><div class=\"u\">عوّض ماكينة التصوير: أمْلي أسئلة مخلوطة وجمل قصص مبهدلة الطلبة تفكّها في أزواج.</div>", "a": "tefl-60-055", "x": "2692188a", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">Limited resources force creativity, and that creativity makes you a far better teacher.</div><div class=\"u\">الخامات المحدودة بتجبّر الإبداع، والإبداع ده بيخلّيك مدرس أحسن بكتير.</div>", "a": "tefl-60-056", "x": "fbb3ccb7", "n": 1, "i": 64}, {"t": "mc", "q": "For a new elementary class of thirty with limited resources, the best first activity is:<br>لفصل ابتدائي جديد من تلاتين طالب بخامات محدودة، أحسن نشاط أول هو:", "opts": ["give noun labels and have students stick them on the correct objects | تدّي ملصقات أسماء والطلبة يلزّقوها على الأشياء الصح", "ask students to write 250 words about themselves | تطلب من الطلبة يكتبوا ٢٥٠ كلمة عن نفسهم", "photocopy thirty gap-fill worksheets | تصوّر تلاتين ورقة عمل ملء فراغات"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Too much writing for day one. | غلط: كتابة كتير لأول يوم.", "No. No photocopier, and it wastes time. | غلط: مفيش ماكينة تصوير، وبتضيّع الوقت."], "h": "", "n": 1, "i": 65}, {"t": "mc", "q": "Which lexical set lends itself best to the A-Z game?<br>أنهي مجموعة مفردات أنسب للعبة الألف للياء؟", "opts": ["hobbies | الهوايات", "planets | الكواكب", "breeds of cats | سلالات القطط"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Too specialist and limited. | غلط: متخصصة ومحدودة جدًا.", "No. How many do you know? | غلط: تعرف كام واحدة أصلًا؟"], "h": "", "n": 1, "i": 66}, {"t": "mc", "q": "After brainstorming the advantages and disadvantages of fast food, the most practical follow-up is:<br>بعد العصف الذهني عن مميزات وعيوب الأكل السريع، أنسب خطوة بعدها:", "opts": ["a debate in groups of four | مناظرة في مجموعات من أربعة", "a photocopied gap-fill on obesity | ملء فراغات مصوّر عن السمنة", "a full discursive essay | مقال جدالي كامل"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. You may have no photocopier. | غلط: ممكن ميبقاش عندك ماكينة تصوير.", "No. Too early for a full essay. | غلط: بدري على مقال كامل."], "h": "", "n": 1, "i": 67}, {"t": "tf", "q": "Furniture is a good lexical set for the A-Z game.<br>الأثاث مجموعة مفردات كويسة للعبة الألف للياء.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Too few words. | غلط: كلمات قليلة جدًا.", "Correct. | صح."], "h": "", "n": 1, "i": 68}, {"t": "tf", "q": "In the advantages and disadvantages game, runners write and thinkers create ideas.<br>في لعبة المميزات والعيوب، العدّائين بيكتبوا والمفكّرين بيطلّعوا الأفكار.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. That is the design. | غلط: ده تصميم اللعبة."], "h": "", "n": 1, "i": 69}, {"t": "mc", "q": "You have no photocopier but want to ask five comprehension questions. You should:<br>معندكش ماكينة تصوير وعايز تسأل خمس أسئلة استيعاب. المفروض:", "opts": ["dictate each question with the words jumbled up | تملي كل سؤال بكلمات مخلوطة", "skip the questions entirely | تلغي الأسئلة خالص", "write each question five times by hand | تكتب كل سؤال خمس مرات بإيدك"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. There is always a workaround. | غلط: دايمًا فيه حل بديل.", "No. That wastes your time. | غلط: ده بيضيّع وقتك."], "h": "", "n": 1, "i": 70}, {"t": "tf", "q": "Poster projects work even with recycled paper that has one clean side.<br>مشاريع البوسترات بتشتغل حتى بورق معاد تدويره بجانب واحد نضيف.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Recycled paper is fine. | غلط: الورق المعاد تدويره تمام."], "h": "", "n": 1, "i": 71}, {"t": "tf", "q": "Limited resources in the long run make you a worse teacher.<br>الخامات المحدودة على المدى الطويل بتخلّيك مدرس أسوأ.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Constraint breeds creativity. | غلط: القيد بيولّد الإبداع.", "Correct. | صح."], "h": "", "n": 1, "i": 72}, {"t": "recall", "q": "Name four large lexical sets for the A-Z game, and two to avoid.<br>اذكر أربع مجموعات مفردات كبيرة للعبة الألف للياء، واتنين تتجنّبهم.", "a": "Good: food and drink, jobs, things in the house, countries, parts of the body (also sports, hobbies). Avoid: furniture and musical instruments, too limited.<br>كويسة: الأكل والشرب، الوظايف، حاجات البيت، الدول، أجزاء الجسم (وكمان الرياضات والهوايات). تجنّب: الأثاث والآلات الموسيقية، محدودة جدًا.", "h": "", "n": 1, "i": 73}, {"t": "recall", "q": "Name five limited-resource activities from this unit.<br>اذكر خمس أنشطة خامات محدودة من الوحدة دي.", "a": "Any five of: A-Z board race, team brainstorming, advantages and disadvantages (thinkers and runners), label the room, poster projects (alphabet, family, grammar), jumbled dictation, mixed-up story sentence ordering.<br>أي خمسة من: سباق الألف للياء، العصف الذهني الجماعي، المميزات والعيوب (مفكّرين وعدّائين)، تعليم الأوضة، مشاريع البوسترات (أبجدية وعائلية وقواعد)، الإملاء المخلوط، ترتيب جمل القصة المبهدلة.", "h": "", "n": 1, "i": 74}, {"t": "write", "q": "Your new school has only a blackboard and chalk. Plan your first lesson. (3-4 sentences)<br>مدرستك الجديدة فيها بس سبورة وطباشير. خطّط أول حصة ليك. (٣-٤ جمل).", "key": "tefl-60:1", "a": "I would start with the label-the-room game: paper strips with desk, window, door and cupboard, stuck on the right objects by the students. Then I would run an A-Z board race with a big lexical set like jobs, so everyone gets up and moves. For speaking, I would write simple prompts on the board, name, age, hobbies, and have students ask and answer in pairs, which also works as my diagnostic. I would end with a five-minute team brainstorm, ready to build a story next lesson.<br>هبدأ بلعبة تعليم الأوضة: شرايط ورق عليها مكتب وشباك وباب ودولاب، الطلبة يلزّقوها على الأشياء الصح. وبعدين هعمل سباق ألف للياء على السبورة بمجموعة مفردات كبيرة زي الوظايف، عشان الكل يقوم ويتحرّك. للكلام، هكتب أسئلة بسيطة على السبورة، الاسم والسن والهوايات، والطلبة تسأل وتجاوب في أزواج، وده كمان اختبار تشخيصي ليا. هنهي بعصف ذهني جماعي خمس دقايق، جاهز نبني قصة الحصة الجاية.", "h": "", "n": 1, "i": 75}, {"t": "write", "q": "Why can limited resources be a gift for a teacher? (3-4 sentences)<br>ليه الخامات المحدودة ممكن تبقى هدية للمدرس؟ (٣-٤ جمل).", "key": "tefl-60:2", "a": "Teachers with unlimited photocopiers often churn out worksheets that nobody needs. Without one, you must invent: jumbled dictations, room labels, board races and posters made by the students themselves. That pushes you to be more creative with your lesson ideas, and in the long run it makes you a far better teacher. You stop believing that a lesson's success hinges on a pile of hand-outs or a book.<br>المدرسين اللي عندهم ماكينات تصوير مفتوحة غالبًا بيطلّعوا أوراق عمل محدش محتاجها. من غيرها، لازم تخترع: إملاء مخلوط وملصقات أوضة وسباقات سبورة وبوسترات من صنع الطلبة نفسهم. ده بيدفعك تبقى أكثر إبداعًا في أفكار دروسك، وعلى المدى الطويل بيخلّيك مدرس أحسن بكتير. بتبطّل تفتكر إن نجاح الحصة متعلّق بكوم أوراق أو كتاب.", "h": "", "n": 1, "i": 76}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 77}];</script>
