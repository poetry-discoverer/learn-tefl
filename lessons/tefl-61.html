<h1>عالم تيفل ٦١: تدريس الفصول الكبيرة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٦١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-61";window.STEPS=[{"t": "section", "h": "The big picture | الصورة الكبيرة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit two: teaching large classes. Most teachers agree a small group is easier, more enjoyable and less time consuming.</div><div class=\"u\">الوحدة التانية: تدريس الفصول الكبيرة. أغلب المدرسين متفقين إن المجموعة الصغيرة أسهل وأمتع وأقل وقت.</div>", "a": "tefl-61-001", "x": "16c01a48", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">Unfortunately, due to budgets, space or lack of teachers, many EFL schools offer large classes, sometimes forty students or more, especially in Asian countries like China.</div><div class=\"u\">للأسف، بسبب الميزانيات أو المساحة أو قلة المدرسين، مدارس إنجليزي كتير بتقدّم فصول كبيرة، أحيانًا أربعين طالب أو أكتر، خصوصًا في دول آسيا زي الصين.</div>", "a": "tefl-61-002", "x": "3ce86894", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">Your class may look like a university lecture hall, but your job is not to lecture.</div><div class=\"u\">فصلك ممكن يبان زي مدرّج جامعة، بس شغلك مش إنك تلقي محاضرة.</div>", "a": "tefl-61-003", "x": "0be84983", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">Just like a small class, you must create engaging activities that keep every student interested and participating, aiming at better communication skills.</div><div class=\"u\">زي الفصل الصغير بالظبط، لازم تعمل أنشطة شيّقة بتخلي كل طالب مهتم ومشارك، بهدف مهارات تواصل أحسن.</div>", "a": "tefl-61-004", "x": "06ae1fe1", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">There are positives too: large classes are noisy but fun and exciting, as long as you have the energy to keep up.</div><div class=\"u\">فيه إيجابيات كمان: الفصول الكبيرة دوشة بس ممتعة ومثيرة، طالما عندك الطاقة إنك تواكب.</div>", "a": "tefl-61-005", "x": "f5cf77ab", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Time flies in a large class; you will rarely clock-watch. You will often over-plan, and the extra work simply rolls into your next lesson.</div><div class=\"u\">الوقت بيعدي بسرعة في الفصل الكبير؛ نادرًا ما هتبص على الساعة. غالبًا هتخطّط أكتر من اللازم، والشغل الزيادة بينقل ببساطة للحصة الجاية.</div>", "a": "tefl-61-006", "x": "ba3d7cdd", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">There is always someone willing to answer questions, even if just guessing; take answers from a variety of students.</div><div class=\"u\">دايمًا فيه حد مستعد يجاوب على الأسئلة، حتى لو بيخمّن؛ خد إجابات من طلبة متنوعين.</div>", "a": "tefl-61-007", "x": "1c23131f", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">And you will need fewer fillers, since core activities take longer to complete.</div><div class=\"u\">ومش هتحتاج حشوات وقت كتير، لأن الأنشطة الأساسية بتاخد وقت أطول تخلّص.</div>", "a": "tefl-61-008", "x": "1bb05dbe", "n": 1, "i": 8}, {"t": "section", "h": "Nine challenges | تسع تحديات", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">Challenge one: intimacy. Names take a while. Keep students in a set seating plan for a reasonable period to help you learn them.</div><div class=\"u\">التحدي الأول: الألفة. الأسماء بتاخد وقت. خلّي الطلبة على خطة قعدة ثابتة فترة معقولة عشان تساعدك تتعلّمها.</div>", "a": "tefl-61-009", "x": "f9ad7868", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Challenge two: anxiety. Being vastly outnumbered can scare teachers.</div><div class=\"u\">التحدي التاني: القلق. إنك تبقى أقلية وسط عدد كبير ممكن يخوّف المدرسين.</div>", "a": "tefl-61-010", "x": "1973a7b9", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Establish rules and guidelines from the very beginning, and keep back-up materials ready in case the lesson goes off-plan.</div><div class=\"u\">أسّس قواعد وإرشادات من أول يوم، واحتفظ بخامات احتياطية جاهزة لو الحصة خرجت عن الخطة.</div>", "a": "tefl-61-011", "x": "42b1d7b4", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">Challenge three: student needs. Individuals may feel too intimidated to raise a hand. Stay accessible: do not hide behind your desk; walk among the students.</div><div class=\"u\">التحدي التالت: احتياجات الطلبة. الأفراد ممكن يخافوا يرفعوا إيدهم. خلّيك متاح: ماتتخبّاش ورا مكتبك؛ امشي بين الطلبة.</div>", "a": "tefl-61-012", "x": "e92eb86c", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Challenge four: marking. Grading for a large class eats time.</div><div class=\"u\">التحدي الرابع: التصحيح. التصحيح لفصل كبير بياكل وقت.</div>", "a": "tefl-61-013", "x": "0e6bdbfd", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Use quick quizzes on the previous lesson, count participation in the assessment, and run peer marking where students swap papers.</div><div class=\"u\">استخدم اختبارات سريعة على الحصة اللي فاتت، واحسب المشاركة في التقييم، وشغّل تصحيح تبادلي الطلبة فيه بيتبادلوا الأوراق.</div>", "a": "tefl-61-014", "x": "7d2bc5ee", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Challenge five: distractions. Latecomers and chatting are inevitable in big groups. Choose your battles.</div><div class=\"u\">التحدي الخامس: المشتّتات. المتأخرين والدردشة حاجات أكيدة في المجموعات الكبيرة. اختار معاركك.</div>", "a": "tefl-61-015", "x": "10d4bc11", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Challenge six: preparation. Photocopying for a large class is slow. Use visual aids and the board to display assignments.</div><div class=\"u\">التحدي السادس: التحضير. التصوير لفصل كبير بطيء. استخدم الوسايل البصرية والسبورة لعرض الواجبات.</div>", "a": "tefl-61-016", "x": "f889fb76", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Learn when the photocopier is free, and do not hog it at busy times; that is no way to endear yourself to colleagues.</div><div class=\"u\">اتعلّم ماكينة التصوير فاضية إمتى، وماتحتكرهاش في أوقات الذروة؛ دي مش طريقة تخلّي زمايلك يحبوك.</div>", "a": "tefl-61-017", "x": "a24f568c", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Challenge seven: noise. Pair and group work gets loud, and often it is earnest enthusiasm for the task.</div><div class=\"u\">التحدي السابع: الدوشة. الشغل بأزواج ومجموعات بيعلّي الصوت، وغالبًا ده حماس صادق للمهمة.</div>", "a": "tefl-61-018", "x": "c80498f3", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">When it turns rowdy and learning suffers, mark acceptable levels and use a noise meter at the front of the class.</div><div class=\"u\">لما تتحوّل لشغب والتعلّم يتأثّر، حدّد المستويات المقبولة واستخدم عدّاد دوشة قدّام الفصل.</div>", "a": "tefl-61-019", "x": "82accf06", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">When the class returns to a reasonable level, reward it creatively, like promising a game at the end of class.</div><div class=\"u\">لما الفصل يرجع لمستوى معقول، كافئه بإبداع، زي وعد بلعبة في آخر الحصة.</div>", "a": "tefl-61-020", "x": "1d8d8bfe", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">Challenge eight: monitoring. Listen for common errors during pair work and feed them back later to the whole class, never singling out individuals.</div><div class=\"u\">التحدي التامن: المتابعة. اسمع الأغلاط الشائعة أثناء شغل الأزواج ورجّعها بعدين للفصل كله، وماتفرّدش حد بالتصحيح أبدًا.</div>", "a": "tefl-61-021", "x": "8c4d632a", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Challenge nine: space. Energetic activities need room. Move desks to one side, or take the students outside for fresh learning impetus.</div><div class=\"u\">التحدي التاسع: المساحة. الأنشطة النشطة محتاجة مكان. حرّك المكاتب لجانب، أو اطلع بالطلبة برّه لدفعة تعلّم جديدة.</div>", "a": "tefl-61-022", "x": "9f225346", "n": 1, "i": 23}, {"t": "section", "h": "Coping strategies | استراتيجيات التعامل", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Coping, rapport: it takes longer with a large class, so prioritise learning names. Give each student a name badge or a paper name card on the desk.</div><div class=\"u\">التعامل، العلاقة: بتاخد وقت أطول مع فصل كبير، فأوّل بتعلّم الأسماء. ادّي كل طالب بطاقة اسم أو كارت اسم ورقي على المكتب.</div>", "a": "tefl-61-023", "x": "3a756006", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">The name game: take everyone to a large space, form a circle, and throw a ball, or a scrunched-up piece of paper, saying your name and the catcher's name. Continue about ten minutes.</div><div class=\"u\">لعبة الأسماء: اطلع بالكل لمكان واسع، اعملوا دايرة، وارموا كورة، أو ورقة متكتّعة، وقولوا اسمك واسم اللي مسكها. كمّلوا حوالي عشر دقايق.</div>", "a": "tefl-61-024", "x": "77982a9f", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Establish trust: let students see you as a person. Mention a football team you support or a favourite movie, without getting too casual.</div><div class=\"u\">ابني الثقة: خلّي الطلبة يشوفوك كإنسان. اذكر فريق كورة بتشجّعه أو فيلم مفضّل، من غير ماتبقى عادي بزيادة.</div>", "a": "tefl-61-025", "x": "d19713b0", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Take notes during group work and feed common errors back to the whole class after the activity.</div><div class=\"u\">سجّل ملاحظات أثناء شغل المجموعات ورجّع الأغلاط الشائعة للفصل كله بعد النشاط.</div>", "a": "tefl-61-026", "x": "a6080d51", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Encourage participation: aggregate homework and attendance into the final grade, and give daily exam hints so students want to attend.</div><div class=\"u\">شجّع المشاركة: احسب الواجب والحضور في الدرجة النهائية، وادّي تلميحات امتحان يومية عشان الطلبة تحب تحضر.</div>", "a": "tefl-61-027", "x": "88203948", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Competition is good: split the class into teams, award points for wins, and subtract points for bad behaviour or excessive noise.</div><div class=\"u\">المنافسة كويسة: اقسِم الفصل لفرق، ادي نقط للفوز، واطرح نقط للسلوك السيئ أو الدوشة الزيادة.</div>", "a": "tefl-61-028", "x": "188b5964", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Stay calm: students sense teacher anxiety and unprepared lessons. Plan well in advance and keep one or two extra activities ready.</div><div class=\"u\">خلّيك هادي: الطلبة بتحس بقلق المدرس والحصص غير المحضّرة. خطّط من بدري واحتفظ بنشاط أو اتنين إضافيين جاهزين.</div>", "a": "tefl-61-029", "x": "5f500004", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Manage noise from day one: establish an acceptable noise level and a stop-and-listen signal, apply it consistently, and avoid gestures or sounds that could offend the local culture.</div><div class=\"u\">دير الدوشة من أول يوم: حدّد مستوى دوشة مقبول وإشارة قِف واسمع، طبّقها بثبات، وابعد عن إيماءات أو أصوات ممكن تزعّل الثقافة المحلية.</div>", "a": "tefl-61-030", "x": "7df2c836", "n": 1, "i": 32}, {"t": "learn", "h": "<div class=\"u\">Reduce marking: design on-point quizzes, use peer evaluations, and leave one short comment at the end of a paper instead of red-lining every mistake.</div><div class=\"u\">قلّل التصحيح: صمّم اختبارات مركّزة، استخدم تقييم الزمايل، واسيّب تعليق قصير في آخر الورقة بدل خط أحمر على كل غلطة.</div>", "a": "tefl-61-031", "x": "efec1ce6", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Enforce a late policy: announce it on day one, for example no entry after the warm-up or after the first ten minutes.</div><div class=\"u\">طبّق سياسة تأخير: أعلنها أول يوم، مثلًا ممنوع دخول بعد الإحماء أو بعد أول عشر دقايق.</div>", "a": "tefl-61-032", "x": "f0620a54", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">Check your employer or Director of Studies supports it, and make catching up the student's responsibility, not yours.</div><div class=\"u\">اتأكد إن شغلك أو مدير الدراسات بيدعمها، وخلّي اللحاق بالفايت مسؤولية الطالب مش مسؤوليتك.</div>", "a": "tefl-61-033", "x": "4bc2537f", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Protect your energy: instead of endless corridor questions, share your e-mail or a class Facebook page and answer on your own time, or finish ten minutes early sometimes for free conversation.</div><div class=\"u\">احمي طاقتك: بدل أسئلة الطرقة اللي ماتخلّصش، شارك إيميلك أو صفحة فيسبوك للفصل وجاوب في وقتك، أو اختم قبل المعاد بعشر دقايق أحيانًا لكلام حر.</div>", "a": "tefl-61-034", "x": "f6f444bc", "n": 1, "i": 36}, {"t": "section", "h": "Activities | الأنشطة", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Activities for large classes, one: small group discussions on themes, with topic suggestions from students themselves.</div><div class=\"u\">أنشطة للفصول الكبيرة، واحد: مناقشات مجموعات صغيرة على مواضيع، باقتراحات مواضيع من الطلبة نفسهم.</div>", "a": "tefl-61-035", "x": "2c9d44d0", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Two: Who Am I? Stick a famous person's name on each student's back; they ask questions to discover who they are, then help others.</div><div class=\"u\">اتنين: مين أنا؟ الزق اسم شخصية مشهورة على ضهر كل طالب؛ بيسألوا أسئلة يكتشفوا هما مين، وبعدين يساعدوا غيرهم.</div>", "a": "tefl-61-036", "x": "dab77f18", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Three: team spelling contests, a point per correct spelling.</div><div class=\"u\">تلاتة: مسابقات تهجئة جماعية، نقطة لكل تهجئة صح.</div>", "a": "tefl-61-037", "x": "cb9be429", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Four: Balderdash. Call out a word; teams write the word and its meaning; a point per student who gets both right.</div><div class=\"u\">أربعة: بالدرداش. انادي كلمة؛ الفرق تكتب الكلمة ومعناها؛ نقطة لكل طالب يجيب الاتنين صح.</div>", "a": "tefl-61-038", "x": "ede673ff", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Five: write the question. Give an answer, like Amanda, and teams write the question: what is your middle name?</div><div class=\"u\">خمسة: اكتب السؤال. ادّي إجابة، زي أماندا، والفرق تكتب السؤال: إيه اسمك الأوسط؟</div>", "a": "tefl-61-039", "x": "79a095fa", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">Six: questionnaires. Students circulate and interview each other, then report the most interesting answer, possibly growing into group presentations.</div><div class=\"u\">ستة: استبيانات. الطلبة بتلف وتقابل بعض، وبعدين يبلّغوا بأغرب إجابة، وممكن تكبر لعروض تقديمية جماعية.</div>", "a": "tefl-61-040", "x": "e6ed8264", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Seven: categories. Call a category like fruit; each student names one in turn; hesitate more than five seconds and you are out. Last one standing wins.</div><div class=\"u\">سبعة: فئات. انادي فئة زي فاكهة؛ كل طالب يسمّي واحدة بالدور؛ تردّد أكتر من خمس ثواني وانت برّه. آخر واحد واقف يكسب.</div>", "a": "tefl-61-041", "x": "a9429db7", "n": 1, "i": 44}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">large class: a class of around forty students or more.</div><div class=\"u\">الفصل الكبير: فصل حوالي أربعين طالب أو أكتر.</div>", "a": "tefl-61-042", "x": "92cde957", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">seating plan: a fixed map of where each student sits.</div><div class=\"u\">خطة القعدة: خريطة ثابتة لقعدة كل طالب.</div>", "a": "tefl-61-043", "x": "e4ca6be5", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">back-up materials: extra activities ready in reserve.</div><div class=\"u\">الخامات الاحتياطية: أنشطة إضافية جاهزة للطوارئ.</div>", "a": "tefl-61-044", "x": "ff179ce9", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">fillers: small activities used to kill spare time.</div><div class=\"u\">الحشوات: أنشطة صغيرة لملء وقت فاضي.</div>", "a": "tefl-61-045", "x": "e6444ec9", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">peer marking: students marking each other's papers.</div><div class=\"u\">التصحيح التبادلي: الطلبة بتصحّح أوراق بعض.</div>", "a": "tefl-61-046", "x": "36c5852e", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">noise meter: a visible gauge of acceptable noise.</div><div class=\"u\">عدّاد الدوشة: مقياس ظاهر للدوشة المقبولة.</div>", "a": "tefl-61-047", "x": "a5b3c510", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">rapport: the trusting relationship between teacher and class.</div><div class=\"u\">الألفة: علاقة الثقة بين المدرس والفصل.</div>", "a": "tefl-61-048", "x": "c48024b6", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">name game: a ball-throwing circle game to learn names.</div><div class=\"u\">لعبة الأسماء: لعبة دايرة وكورة لتعلّم الأسماء.</div>", "a": "tefl-61-049", "x": "8b22a70e", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">late policy: a stated rule about arriving late.</div><div class=\"u\">سياسة التأخير: قاعدة معلنة عن الحضور متأخر.</div>", "a": "tefl-61-050", "x": "8ed3d6ad", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">monitoring: watching and listening during student work.</div><div class=\"u\">المتابعة: الملاحظة والاستماع أثناء شغل الطلبة.</div>", "a": "tefl-61-051", "x": "d3d6202a", "n": 1, "i": 55}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">Large classes are common and not lectures: keep everyone active with engaging, communicative tasks.</div><div class=\"u\">الفصول الكبيرة شائعة ومش محاضرات: خلّي الكل نشط بمهام شيّقة تفاعلية.</div>", "a": "tefl-61-052", "x": "20877c21", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">They have real positives: time flies, someone always answers, over-planning rolls forward, fewer fillers needed.</div><div class=\"u\">ليهم إيجابيات حقيقية: الوقت بيعدي، دايمًا فيه حد يجاوب، التخطيط الزيادة بينقل للحصة الجاية، وحشوات أقل.</div>", "a": "tefl-61-053", "x": "1b1c7f69", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">Meet the nine challenges: seating plan, early rules, accessibility, smart marking, chosen battles, photocopier timing, noise meter, class-wide error feedback, creative space.</div><div class=\"u\">واجه التحديات التسعة: خطة قعدة، قواعد مبكرة، تواجد، تصحيح ذكي، معارك مختارة، توقيت ماكينة التصوير، عدّاد دوشة، تصحيح أغلاط على مستوى الفصل، مساحة مبتكرة.</div>", "a": "tefl-61-054", "x": "8c893780", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Build rapport with the name game, trust with personal touches, calm with preparation, and order with a day-one signal and a fair late policy.</div><div class=\"u\">ابني الألفة بلعبة الأسماء، والثقة بلمسات شخصية، والهدوء بالتحضير، والنظام بإشارة من أول يوم وسياسة تأخير عادلة.</div>", "a": "tefl-61-055", "x": "276eccc1", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Use big-class activities: discussions, Who Am I, spelling contests, Balderdash, write the question, questionnaires, categories.</div><div class=\"u\">استخدم أنشطة الفصول الكبيرة: المناقشات، مين أنا، مسابقات التهجئة، بالدرداش، اكتب السؤال، الاستبيانات، الفئات.</div>", "a": "tefl-61-056", "x": "f3ef70b9", "n": 1, "i": 61}, {"t": "tf", "q": "In a class of fifty, it is understandable not to address each student by name.<br>في فصل من خمسين طالب، مفهوم إنك ماتناديش كل طالب باسمه.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Names matter more, not less. | غلط: الأسماء أهم مش أقل.", "Correct. | صح."], "h": "", "n": 1, "i": 62}, {"t": "tf", "q": "To reduce marking in a large class, it is OK to just give less homework.<br>عشان تقلّل التصحيح في فصل كبير، عادي بس تدّي واجب أقل.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Mark smarter, not less. | غلط: صحّح بذكاء مش أقل.", "Correct. | صح."], "h": "", "n": 1, "i": 63}, {"t": "tf", "q": "With many disruptive latecomers, a no-entry-after-ten-minutes rule is a good idea.<br>مع متأخرين كتير مزعجين، قاعدة ممنوع-دخول-بعد-عشر-دقايق فكرة كويسة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. It works with employer support. | غلط: بتشتغل بدعم الشغل."], "h": "", "n": 1, "i": 64}, {"t": "mc", "q": "A noisy large class working in pairs usually means:<br>فصل كبير ودوشة وهو شغال بأزواج معناها غالبًا:", "opts": ["earnest enthusiasm for the task | حماس صادق للمهمة", "the lesson has failed | الحصة فشلت", "students are mocking the teacher | الطلبة بتسخر من المدرس"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Noise often means engagement. | غلط: الدوشة غالبًا معناها انخراط.", "No. Do not assume the worst. | غلط: ماتفتكرش الأسوأ."], "h": "", "n": 1, "i": 65}, {"t": "mc", "q": "You keep hearing the same error during pair work. You should:<br>بتسمع نفس الغلط بتتكرر أثناء شغل الأزواج. المفروض:", "opts": ["note it and address it later as a common class error | تسجّله وتعالجه بعدين كغلط شائع للفصل", "stop the pair and correct them publicly | توقّف الزوج وتصحّح لهم قدّام الكل", "ignore it; errors fix themselves | تتجاهله؛ الأغلاط بتتصلح لوحدها"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Never single out. | غلط: ماتفرّدش حد أبدًا.", "No. Common errors need teaching. | غلط: الأغلاط الشائعة محتاجة تعليم."], "h": "", "n": 1, "i": 66}, {"t": "mc", "q": "Which is a listed advantage of large classes?<br>أنهي واحدة من مميزات الفصول الكبيرة المذكورة؟", "opts": ["you rarely need fillers, since activities take longer | نادرًا محتاج حشوات، لأن الأنشطة بتاخد وقت أطول", "marking is faster | التصحيح أسرع", "everyone stays quiet | الكل بيفضل ساكت"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Marking is slower, so mark smarter. | غلط: التصحيح أبطأ، فصحّح بذكاء.", "No. Large classes are noisy but fun. | غلط: الفصول الكبيرة دوشة بس ممتعة."], "h": "", "n": 1, "i": 67}, {"t": "mc", "q": "The first-lesson name game uses:<br>لعبة الأسماء في الحصة الأولى بتستخدم:", "opts": ["a ball or scrunched paper thrown around a circle with names | كورة أو ورقة متكتّعة بتترمي في دايرة مع الأسماء", "a written test of every name | اختبار كتابي على كل اسم", "silent desk study of a register | مذاكرة صامتة لكشف الحضور"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. It is a movement game. | غلط: دي لعبة حركة.", "No. Names are learned by playing. | غلط: الأسماء بتتعلّم باللعب."], "h": "", "n": 1, "i": 68}, {"t": "tf", "q": "Hogging the photocopier at busy times endears you to fellow teachers.<br>احتكار ماكينة التصوير في أوقات الذروة بيخلّي زمايلك يحبوك.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Share the machine. | غلط: شارك الماكينة.", "Correct. | صح."], "h": "", "n": 1, "i": 69}, {"t": "recall", "q": "Name six of the nine large-class challenges and their fixes.<br>اذكر ستة من تحديات الفصول الكبيرة التسعة وحلولها.", "a": "Any six of: intimacy (seating plan), anxiety (early rules, back-up materials), student needs (walk among students), marking (quick quizzes, peer marking), distractions (choose battles), preparation (board and visuals, copier timing), noise (noise meter, creative rewards), monitoring (class-wide error feedback), space (move desks, go outside).<br>أي ستة من: الألفة (خطة قعدة)، القلق (قواعد مبكرة وخامات احتياطية)، احتياجات الطلبة (امشي بينهم)، التصحيح (اختبارات سريعة وتصحيح تبادلي)، المشتّتات (اختار معاركك)، التحضير (سبورة وبصريات وتوقيت الماكينة)، الدوشة (عدّاد دوشة ومكافآت مبتكرة)، المتابعة (تصحيح أغلاط على مستوى الفصل)، المساحة (حرّك المكاتب أو اطلع برّه).", "h": "", "n": 1, "i": 70}, {"t": "recall", "q": "Name five activities suited to large classes.<br>اذكر خمس أنشطة مناسبة للفصول الكبيرة.", "a": "Any five of: small group discussions, Who Am I, team spelling contests, Balderdash, write the question, questionnaires, categories.<br>أي خمسة من: مناقشات المجموعات الصغيرة، مين أنا، مسابقات التهجئة الجماعية، بالدرداش، اكتب السؤال، الاستبيانات، الفئات.", "h": "", "n": 1, "i": 71}, {"t": "write", "q": "How would you survive your first week with a class of forty? (3-4 sentences)<br>إزاي هتنجو من أسبوعك الأول مع فصل من أربعين؟ (٣-٤ جمل).", "key": "tefl-61:1", "a": "On day one I would set the rules, the noise signal and the late policy, then play the circle name game for ten minutes so names start sticking. I would keep a fixed seating plan and put name cards on desks to build intimacy faster. I would plan every lesson with one or two back-up activities, because students sense an unprepared teacher. And I would protect my energy: peer marking, short comments instead of red lines, and questions by e-mail rather than corridor crowds.<br>في أول يوم هحدّد القواعد وإشارة الدوشة وسياسة التأخير، وبعدين هلعب لعبة الأسماء في دايرة عشر دقايق عشان الأسماء تبدأ تثبت. هخلي خطة قعدة ثابتة وكروت أسماء على المكاتب عشان أبني ألفة أسرع. هخطّط كل حصة بنشاط أو اتنين احتياطيين، لأن الطلبة بتحس بالمدرس غير المحضّر. وهحمي طاقتي: تصحيح تبادلي وتعليقات قصيرة بدل الخطوط الحمرا، وأسئلة بالإيميل بدل زحمة الطرقة.", "h": "", "n": 1, "i": 72}, {"t": "write", "q": "Is noise in a large class good or bad? Explain. (3-4 sentences)<br>الدوشة في الفصل الكبير كويسة ولا وحشة؟ اشرح. (٣-٤ جمل).", "key": "tefl-61:2", "a": "Mostly it is good: a lot of large-class noise is earnest enthusiasm for the task, and a silent big class is often a bored one. The line is crossed when behaviour turns rowdy and learning is impaired. Then you act without shouting: a noise meter at the front shows students when they cross the threshold, and creative rewards, like a promised end-of-class game, pull them back. From day one, a consistent stop-and-listen signal, with culturally safe gestures, keeps the balance.<br>غالبًا كويسة: دوشة الفصل الكبير في أغلبها حماس صادق للمهمة، وفصل كبير ساكت غالبًا فصل زهقان. الخط بيتعدّى لما السلوك يتحوّل لشغب والتعلّم يتأثّر. ساعتها تتصرّف من غير صريخ: عدّاد دوشة قدّام الفصل بيورّي الطلبة لما يتعدّوا الحد، والمكافآت المبتكرة، زي وعد بلعبة آخر الحصة، بترجّعهم. من أول يوم، إشارة قِف-واسمع ثابتة، بإيماءات محترمة للثقافة، بتحافظ على التوازن.", "h": "", "n": 1, "i": 73}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 74}];</script>
