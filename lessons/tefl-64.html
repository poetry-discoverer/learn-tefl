<script>window.LESSON_ID="tefl-64";window.STEPS=[{"t": "section", "h": "Two key aspects | جانبين أساسيين", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">This is the final unit of the course. It explores two key cultural aspects for classroom survival: appropriateness, and cross-cultural aspects in the classroom.</div><div class=\"u\">دي آخر وحدة في الكورس. بتستكشف جانبين ثقافيين أساسيين للنجاة في الفصل: الملاءمة، والجوانب متعددة الثقافات في الفصل.</div>", "x": "c61a4d6f", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">The word appropriateness has several meanings in language. Here our focus is cultural contextualisation: whether a word or an act fits its context.</div><div class=\"u\">كلمة الملاءمة ليها معاني كتير في اللغة. تركيزنا هنا على السياق الثقافي: هل الكلمة أو الفعل مناسب لسياقه.</div>", "x": "089e9899", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">A subtler aspect of meaning that learners often need: whether a particular item is appropriate for use in a certain context.</div><div class=\"u\">جانب أدق من المعنى محتاجه المتعلمين كتير: هل العنصر ده مناسب للاستخدام في سياق معين.</div>", "x": "f206b1ba", "n": 1, "i": 3}, {"t": "tf", "q": "A subtler aspect of meaning that often needs to be introduced to learners is whether a particular item is appropriate for use in a certain context.<br>جانب أدق من المعنى محتاج كتير يتقدّم للمتعلمين هو هل عنصر معين مناسب للاستخدام في سياق معين.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Context decides fit. | غلط: السياق هو اللي بيحدّد الملاءمة."], "h": "", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">A speech act is measured against sociocultural norms. The norms may vary a little within a group, but the society as a whole generally recognises them.</div><div class=\"u\">الفعل الكلامي بيتقاس بالمعايير الاجتماعية والثقافية. المعايير ممكن تختلف شوية جوه المجموعة، بس المجتمع كله عمومًا بيعترف بيها.</div>", "x": "d929fc96", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">The same speech act that is fine in one society's culture may not be considered appropriate in another culture.</div><div class=\"u\">نفس الفعل الكلامي اللي عادي في ثقافة مجتمع، ممكن ميتعتبرش مناسب في ثقافة تانية.</div>", "x": "b1c41a53", "n": 1, "i": 6}, {"t": "tf", "q": "The same speech act in one society's culture will always be considered appropriate in another culture.<br>نفس الفعل الكلامي في ثقافة مجتمع دايمًا هيتعتبر مناسب في ثقافة تانية.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Appropriateness changes across cultures. | غلط: الملاءمة بتتغيّر بين الثقافات.", "Correct. | صح."], "h": "", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">There are repercussions if a learner says words viewed as inappropriate in another culture. Repeated many times, native speakers will probably view the learner negatively.</div><div class=\"u\">في عواقب لو متعلم قال كلام متعتبر غير لائق في ثقافة تانية. لو اتكرر مرات كتير، أصحاب اللغة غالبًا هيشوفوا المتعلم بشكل سلبي.</div>", "x": "fc3d9acc", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">For this reason, you must make your learners aware of possible cross-linguistic problems.</div><div class=\"u\">علشان كده، لازم تخلّي متعلمينك واعيين بالمشاكل المحتملة بين اللغات.</div>", "x": "1f2b6812", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">Learners should know whether a word or phrase is very common, relatively rare, or taboo in polite conversation.</div><div class=\"u\">المتعلمين المفروض يعرفوا إذا كانت كلمة أو عبارة منتشرة جدًا، نادرة نسبيًا، أو تابو في الكلام المهذب.</div>", "x": "95c782d0", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">They should also know whether it tends to be used in writing but not speech, or suits formal more than informal talk.</div><div class=\"u\">والمفروض كمان يعرفوا إذا كانت بتتكتب أكتر ما بتتقال، أو أنسب للرسمي عن غير الرسمي.</div>", "x": "60b17a9f", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Example: weep and cry mean almost the same thing, but weep is more formal and poetic, tends to appear in writing more than speech, and is much less common.</div><div class=\"u\">مثال: weep و cry معناهم تقريبًا واحد، بس weep أرقى وأكثر شاعرية، وبتتكتب أكتر ما بتتقال، وأقل انتشارًا بكتير.</div>", "x": "169010b5", "n": 1, "i": 12}, {"t": "section", "h": "Six things to remember | ست حاجات تفتكرها", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Remember this: communication is culture bound. The way a person communicates, and the words and structures she uses, come from her culture.</div><div class=\"u\">افتكر ده: التواصل مرتبط بالثقافة. طريقة الشخص في التواصل، والكلمات والتراكيب اللي بيستخدمها، جاية من ثقافته.</div>", "x": "e5b31ec2", "n": 1, "i": 14}, {"t": "tf", "q": "Communication is culture bound: the way an individual communicates and the words and structures she uses come from her culture.<br>التواصل مرتبط بالثقافة: طريقة الفرد في التواصل والكلمات والتراكيب اللي بيستخدمها جاية من ثقافته.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Culture shapes communication. | غلط: الثقافة بتشكّل التواصل."], "h": "", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Students with different cultural norms are at risk if you have little knowledge, sensitivity or appreciation of the diversity in communication styles.</div><div class=\"u\">الطلبة أصحاب المعايير الثقافية المختلفة في خطر لو معرفتك أو حساسيتك أو تقديرك لتنوّع أساليب التواصل قليل.</div>", "x": "bda06ffb", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">You may then perceive differences as problems, and respond to diversity with negative attitudes, low expectations, and culturally inappropriate teaching and assessment.</div><div class=\"u\">ساعتها ممكن تشوف الاختلافات كمشاكل، وترد على التنوّع بسلوكيات سلبية وتوقّعات منخفضة وإجراءات تدريس وتقييم غير مناسبة ثقافيًا.</div>", "x": "075b4564", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Cultures vary internally and are changeable. There are usually many cultural differences within a single race or nationality. Avoid stereotyping your students.</div><div class=\"u\">الثقافات متنوّعة من جوه وقابلة للتغيير. عادة في اختلافات ثقافية كتير جوه نفس العِرق أو الجنسية. تجنّب الصور النمطية عن طلبتك.</div>", "x": "a92cc7fa", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">What is logical and important in your culture, like always tagging please onto a request or taking turns to speak, may seem irrational and unimportant in another culture.</div><div class=\"u\">اللي منطقي ومهم في ثقافتك، زي لزق please في أي طلب أو التناوب في الكلام، ممكن يبان غير منطقي ومش مهم في ثقافة تانية.</div>", "x": "ffbf9c6b", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">When describing another culture's language, teachers tend to stress the differences and overlook the similarities. Do not fall into this trap.</div><div class=\"u\">لما بيوصفوا لغة ثقافة تانية، المدرسين بيميلوا يركّزوا على الاختلافات ويتجاهلوا التشابهات. متقعش في الفخ ده.</div>", "x": "fa74d872", "n": 1, "i": 20}, {"t": "tf", "q": "In describing another culture's language, teachers tend to stress the similarities and overlook the differences.<br>لما بيوصفوا لغة ثقافة تانية، المدرسين بيميلوا يركّزوا على التشابهات ويتجاهلوا الاختلافات.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Similarities get overlooked. | غلط: التشابهات هي اللي بتتتجاهل.", "Correct. | صح."], "h": "", "n": 1, "i": 21}, {"t": "section", "h": "Barriers to avoid | حواجز تتجنّبها", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Avoid inappropriate cross-cultural barriers. First: be aware of words, images and situations that suggest all or most members of a racial group are the same.</div><div class=\"u\">تجنّب حواجز التواصل الثقافي غير اللائقة. أولًا: انتبه للكلمات والصور والمواقف اللي بتوحي إن كل أو أغلب أفراد مجموعة عرقية زي بعض.</div>", "x": "3c0ec712", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Second: watch the negative implications of word and colour symbolism that could offend people or reinforce bias.</div><div class=\"u\">ثانيًا: راقب الدلالات السلبية لرمزية الكلمات والألوان اللي ممكن تجرح ناس أو تعزّز التحيّز.</div>", "x": "e1b23c71", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Terms such as black magic or black market can be offensive in some cultures.</div><div class=\"u\">مصطلحات زي black magic أو black market ممكن تبقى مسيئة في ثقافات معينة.</div>", "x": "d312ec02", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Third: avoid words with questionable racial or ethnic connotations. A phrase like you people can carry a racial overtone.</div><div class=\"u\">ثالثًا: تجنّب الكلمات اللي ليها دلالات عرقية أو إثنية مشكوك فيها. عبارة زي you people ممكن تحمل لمحة عنصرية.</div>", "x": "463698d4", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Fourth: words, objects, characters and symbols may reflect different beliefs or values for different groups.</div><div class=\"u\">رابعًا: الكلمات والأشياء والشخصيات والرموز ممكن تعبّر عن معتقدات أو قيم مختلفة لمجموعات مختلفة.</div>", "x": "5566b046", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">The confederate flag and Uncle Remus stories may offend African Americans, because they reflect the culture of slavery and the Old South.</div><div class=\"u\">علم الكونفيدرالية وحكايات Uncle Remus ممكن تسيء للأمريكيين الأفارقة، لأنها بتعكس ثقافة العبودية والجنوب القديم.</div>", "x": "118b620f", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Fifth: rules for taking turns in conversation differ. Some cultures see breaking in to reinforce or disagree with another's point as perfectly permissible, indeed desirable.</div><div class=\"u\">خامسًا: قواعد التناوب في الكلام بتختلف. ثقافات معينة بتشوف المقاطعة عشان تؤيّد أو تعارض نقطة حد حاجة مقبولة تمامًا، بل مرغوبة.</div>", "x": "a70b94de", "n": 1, "i": 29}, {"t": "tf", "q": "All cultures have the same rules for taking turns during conversations.<br>كل الثقافات عندها نفس قواعد التناوب في الكلام.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Turn-taking varies. | غلط: التناوب مختلف.", "Correct. | صح."], "h": "", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Sixth: cultures use different standards for loudness, speed of delivery, silence, attentiveness and time to respond.</div><div class=\"u\">سادسًا: الثقافات بتستخدم معايير مختلفة لعلو الصوت وسرعة الكلام والصمت والانتباه ووقت الرد.</div>", "x": "8cc6d004", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Far East societies value contemplation highly, so they tend to feel little responsibility to make immediate responses.</div><div class=\"u\">مجتمعات الشرق الأقصى بتقدّر التأمّل جدًا، فبتميل ماتحسش بمسؤولية ترد فورًا.</div>", "x": "2180a237", "n": 1, "i": 32}, {"t": "learn", "h": "<div class=\"u\">Seventh: understanding another culture's language appropriateness is a continuous process. It never really ends.</div><div class=\"u\">سابعًا: فهم ملاءمة لغة ثقافة تانية عملية مستمرة. مابتخلصش فعلًا أبدًا.</div>", "x": "c17ec0e1", "n": 1, "i": 33}, {"t": "section", "h": "Cross-cultural classroom | الفصل متعدد الثقافات", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">An awareness of cross-cultural aspects in your classroom is vital. They play a key part in classroom dynamics.</div><div class=\"u\">الوعي بالجوانب متعددة الثقافات في فصلك حيوي. دي بتلعب دور أساسي في ديناميكيات الفصل.</div>", "x": "361b209b", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Handle these aspects right and the class will be on fire. Get any important cross-cultural aspect wrong and the learning may well be disrupted.</div><div class=\"u\">اتعامل مع الجوانب دي صح والفصل هيولّع. غلّط في أي جانب ثقافي مهم والتعلّم غالبًا هيتعطّل.</div>", "x": "f41a0f73", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Be sensitive to cultural differences and cultural elements at all times, particularly those of the host culture, since they can influence overall student learning behaviour.</div><div class=\"u\">كن حساس للاختلافات والعناصر الثقافية طول الوقت، خصوصًا بتاعة الثقافة المضيفة، لأنها ممكن تأثّر على سلوك التعلّم العام للطلبة.</div>", "x": "4989b253", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Be fully aware of the environment you work in, and do not judge students on the basis of your own cultural background and educational experiences.</div><div class=\"u\">كن واعي تمامًا بالبيئة اللي شغّال فيها، وماتحكمش على الطلبة على أساس خلفيتك الثقافية وتجاربك التعليمية انت.</div>", "x": "587c3ba1", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">If you are not aware of cultural nuances, it can prove detrimental to your success.</div><div class=\"u\">لو مش واخد بالك من الفروق الثقافية الدقيقة، ده ممكن يضرّ نجاحك فعلًا.</div>", "x": "e27077d9", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">You cannot assume that your expectations of the classroom will be the same as the learners' expectations.</div><div class=\"u\">ماتقدرش تفترض إن توقّعاتك من الفصل هي نفسها توقّعات المتعلمين.</div>", "x": "0fe1ce98", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Remember: the comments below are general. Every single student from a particular culture will not necessarily display the same behaviours.</div><div class=\"u\">افتكر: الملاحظات الجاية عامة. مش كل طالب من ثقافة معينة لازم يورّي نفس السلوكيات.</div>", "x": "a9f83ad6", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">These examples depend on where you are teaching and on your students' cultural background and educational experiences. Reflect on this information regularly; it will serve you well.</div><div class=\"u\">الأمثلة دي بتعتمد على فين بتدرّس وعلى الخلفية الثقافية والتعليمية لطلبتك. راجع المعلومات دي بانتظام؛ هتفيدك كويس.</div>", "x": "30a40496", "n": 1, "i": 42}, {"t": "section", "h": "Learners' expectations | توقّعات المتعلمين", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Learners' expectations: learners from more traditional educational systems may expect you to behave in a more formal and authoritarian fashion during classes.</div><div class=\"u\">توقّعات المتعلمين: المتعلمين من الأنظمة التعليمية الأكثر تقليدية ممكن يتوقّعوا إنك تتصرّف بشكل رسمي وسلطوي أكتر في الحصص.</div>", "x": "f43ba8e7", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">They may also want extensive correction of grammatical form or pronunciation during all activities, rather than at specified points in a lesson, or not at all.</div><div class=\"u\">وممكن كمان يعايزوا تصحيح مكثّف للقواعد أو النطق أثناء كل الأنشطة، بدل نقاط محدّدة في الحصة، أو لأ خالص.</div>", "x": "3b56d56d", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">In some cultures, such as Brazil, Norway and Spain, students are expected to be vocal and proactive in the learning process.</div><div class=\"u\">في ثقافات زي البرازيل والنرويج وإسبانيا، الطلبة متوقّع منهم يبقوا صوتهم عالي وسبّاقين في عملية التعلّم.</div>", "x": "71954fee", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">In other cultures, such as Japan and Korea, learners are expected to be silent, passive recipients of knowledge.</div><div class=\"u\">في ثقافات تانية زي اليابان وكوريا، المتعلمين متوقّع منهم يبقوا ساكتين، مستقبلين سلبيين للمعرفة.</div>", "x": "b6ef22c2", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">In some cultures, silence is taken as a sign of respect and willingness to learn; in others, it is seen as boredom and a refusal to participate.</div><div class=\"u\">في ثقافات، الصمت بيتاخد كعلامة احترام ورغبة في التعلّم؛ في تانية، بيتشاف كملل ورفض للمشاركة.</div>", "x": "bd7cdd94", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">In some cultures, asking a question is seen as disrespectful, challenging and inappropriate; in others, it is a welcome sign of students taking responsibility for their own learning.</div><div class=\"u\">في ثقافات، سؤال المدرس بيتشاف كقلة احترام وتحدّي وعدم لياقة؛ في تانية، ده علامة مرحّب بيها إن الطلبة بياخدوا مسؤولية تعلّمهم.</div>", "x": "0244fdf7", "n": 1, "i": 49}, {"t": "tf", "q": "In every culture, asking a question is seen as a welcome sign of students taking responsibility for their own learning.<br>في كل الثقافات، طرح السؤال بيتشاف كعلامة مرحّب بيها إن الطلبة بياخدوا مسؤولية تعلّمهم.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Questions can offend. | غلط: الأسئلة ممكن تسيء.", "Correct. | صح."], "h": "", "n": 1, "i": 50}, {"t": "section", "h": "Teachers, gender, age, status | المدرسين والنوع والسن والمكانة", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">Teachers' expectations: you also bring your own expectations about teacher behaviour, and about appropriate learner behaviour in your culture in general and in the classroom.</div><div class=\"u\">توقّعات المدرسين: انت كمان جايب توقّعاتك عن سلوك المدرس، وعن سلوك المتعلم المناسب في ثقافتك عمومًا وفي الفصل.</div>", "x": "bf3c7cfe", "n": 1, "i": 52}, {"t": "tf", "q": "You bring to the classroom your own expectations regarding teacher behaviour.<br>انت بتجيب معاك للفصل توقّعاتك الخاصة عن سلوك المدرس.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Everyone carries expectations. | غلط: كلنا بنحمل توقّعات."], "h": "", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">You may unconsciously attribute these same expectations to your students, which heightens the potential for conflicting expectations and evaluations of behaviour between you.</div><div class=\"u\">ممكن لا شعوريًا تنسب نفس التوقّعات دي لطلبتك، وده بيزوّد احتمال تعارض التوقّعات وتقييمات السلوك بينك وبينهم.</div>", "x": "064ec38e", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">Gender, age and status: find out whether learners have experienced mixed groupings, and whether they expect male and female teachers to behave differently.</div><div class=\"u\">النوع والسن والمكانة: اعرف إذا كان المتعلمين جرّبوا مجموعات مختلطة، وهل متوقّعين المدرسين الولاد والبنات يتصرّفوا مختلف.</div>", "x": "9d2ef540", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Find out too how group configurations and activities like role plays might affect learners because of native cultural constraints. Research this before starting off.</div><div class=\"u\">واعرف كمان إزاي تشكيلات المجموعات وأنشطة زي لعب الأدوار ممكن تأثّر عليهم بسبب قيود ثقافتهم الأصلية. ابحث ده قبل ما تبدأ.</div>", "x": "b55d4a17", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">You may meet reluctance from men and women from cultures where women's social roles have historically limited active participation in mixed settings, for example Afghanistan and Saudi Arabia.</div><div class=\"u\">ممكن تقابل تردّد من رجالة وستات من ثقافات أدوار الستات الاجتماعية فيها تاريخيًا حدّت من المشاركة النشطة في الأماكن المختلطة، زي أفغانستان والسعودية.</div>", "x": "89b808ff", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">If some students see women, especially younger or lower-status women, as lower in ranking, that exaggerates their negative reactions.</div><div class=\"u\">لو بعض الطلبة شايفين الستات، خصوصًا الأصغر أو الأقل مكانة، ترتيبهم أقل، ده بيضخّم ردود أفعالهم السلبية.</div>", "x": "3dd6edee", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">Those reactions flare when they are interrupted, corrected, or told to do things in the classroom that are unfamiliar.</div><div class=\"u\">ردود الفعل دي بتولّع لما يتقاطعوا أو يتصحّحوا أو يتقالهم حاجات غريبة عليهم في الفصل.</div>", "x": "923d163b", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Some students feel they cannot interrupt or correct students who are older, in a high-status job, or male, and may be shocked when you do not pay attention to such distinctions.</div><div class=\"u\">بعض الطلبة حاسين إنهم ميقدروش يقاطعوا أو يصحّحوا طلبة أكبر سنًا أو في وظيفة مرموقة أو ولاد، وممكن يتصادموا لما انت ماتديش بالك للفروق دي.</div>", "x": "8668ac2b", "n": 1, "i": 60}, {"t": "section", "h": "Taboo topics | مواضيع تابو", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Inappropriate discussion topics in various countries, in general: religion and politics.</div><div class=\"u\">مواضيع النقاش غير المناسبة في دول كتير، بشكل عام: الدين والسياسة.</div>", "x": "dc1b4f3d", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Also dating and sexual relations, gender roles, and civil strife, especially where some students are refugees from that strife.</div><div class=\"u\">وكمان المواعدة والعلاقات الجنسية، وأدوار الجنسين، والصراع الأهلي، خصوصًا لما بعض الطلبة لاجئين من الصراع ده.</div>", "x": "c5e186d2", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">Also immigration, where students are in the process and personal questions may unsettle them; freedom and democracy; human rights issues; and conflicts with other countries.</div><div class=\"u\">وكمان الهجرة، لما الطلبة في نص إجراءاتها والأسئلة الشخصية ممكن تقلقهم؛ والحرية والديمقراطية؛ وقضايا حقوق الإنسان؛ والصراعات مع دول تانية.</div>", "x": "400a543f", "n": 1, "i": 64}, {"t": "recall", "q": "Name the inappropriate discussion topics the unit lists for various countries.<br>اذكر مواضيع النقاش غير المناسبة اللي الوحدة بتعدّدها لدول كتير.", "a": "Religion; politics; dating and sexual relations; gender roles; civil strife, especially with refugee students; immigration; freedom and democracy; human rights issues; and conflicts with other countries.<br>الدين؛ السياسة؛ المواعدة والعلاقات الجنسية؛ أدوار الجنسين؛ الصراع الأهلي، خصوصًا مع طلبة لاجئين؛ الهجرة؛ الحرية والديمقراطية؛ قضايا حقوق الإنسان؛ والصراعات مع دول تانية.", "h": "", "n": 1, "i": 65}, {"t": "learn", "h": "<div class=\"u\">Discussing opinions and beliefs: in some cultures, reaching a group consensus is valued more highly than stating a personal opinion, so use discussion-type tasks with care.</div><div class=\"u\">مناقشة الآراء والمعتقدات: في ثقافات، الوصول لإجماع المجموعة أعلى قيمة من قول رأي شخصي، فاستخدم أنشطة النقاش بحذر.</div>", "x": "729d2f00", "n": 1, "i": 66}, {"t": "learn", "h": "<div class=\"u\">The cultural make-up of your class will determine your approach. When well used, these activities can be very successful.</div><div class=\"u\">التركيبة الثقافية لفصلك هي اللي هتحدّد أسلوبك. لما بتتستخدم كويس، الأنشطة دي ممكن تنجح جدًا.</div>", "x": "cd89a536", "n": 1, "i": 67}, {"t": "section", "h": "Differences one | اختلافات واحد", "n": 1, "i": 68}, {"t": "learn", "h": "<div class=\"u\">Gestures: people do not stop finding a gesture offensive just because they understand that it means something else in other countries.</div><div class=\"u\">الإيماءات: الناس مابتبطّلش تتجرح من إيماءة بس لأنها فاهمة إنها بتعني حاجة تانية في بلاد تانية.</div>", "x": "4032f1bf", "n": 1, "i": 69}, {"t": "tf", "q": "People stop finding a gesture offensive once they understand it means something else in other countries.<br>الناس بتبطّل تتجرح من إيماءة لما بتفهم إنها بتعني حاجة تانية في بلاد تانية.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Offence survives understanding. | غلط: الجرح بيفضل رغم الفهم.", "Correct. | صح."], "h": "", "n": 1, "i": 70}, {"t": "learn", "h": "<div class=\"u\">Impulsiveness versus reflection: in most of the USA, children are encouraged to answer any question quickly; in Japan, reflection is encouraged before answering.</div><div class=\"u\">الاندفاع في مقابل التأمّل: في أغلب أمريكا، الأطفال بيتشجّعوا يجاوبوا على أي سؤال بسرعة؛ في اليابان، التأمّل قبل الإجابة هو المتشجَّع.</div>", "x": "8c9bf40c", "n": 1, "i": 71}, {"t": "learn", "h": "<div class=\"u\">Proxemics: each culture has its own norms for the distance between two people standing and conversing, and these norms may differ between you and your students.</div><div class=\"u\">القُربيات: كل ثقافة ليها معاييرها للمسافة بين شخصين واقفين بيتكلّموا، والمعايير دي ممكن تختلف بينك وبين طلبتك.</div>", "x": "a7678a0f", "n": 1, "i": 72}, {"t": "learn", "h": "<div class=\"u\">Eye contact: in some cultures, respect is shown by avoiding eye contact or shortening it; in others, making eye contact is evidence of honesty and respectfulness.</div><div class=\"u\">التواصل البصري: في ثقافات، الاحترام بيتظهر بتجنّب النظر في العين أو تقصيره؛ في تانية، النظر في العين دليل أمانة واحترام.</div>", "x": "f62c265f", "n": 1, "i": 73}, {"t": "learn", "h": "<div class=\"u\">One frequently misunderstood example: East Asian students often close their eyes when concentrating. That is concentration, not sleepiness.</div><div class=\"u\">مثال بيتفهم غلط كتير: طلبة شرق آسيا كتير بيغمّضوا عينيهم لما بيركّزوا. ده تركيز، مش نعاس.</div>", "x": "30251ca9", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">In some cultures, your failure to make eye contact with students could be interpreted as you lacking confidence.</div><div class=\"u\">في ثقافات معينة، عدم نظرك في عينين الطلبة ممكن يتفسّر إنك ناقص ثقة.</div>", "x": "1ae48a0c", "n": 1, "i": 75}, {"t": "learn", "h": "<div class=\"u\">Active participation: verbally expressing ideas and asking questions during class can prove difficult for students unaccustomed to this form of participation.</div><div class=\"u\">المشاركة النشطة: قول الأفكار بصوت عالي وطرح الأسئلة أثناء الحصة ممكن يبقى صعب على الطلبة غير المتعودين على النوع ده من المشاركة.</div>", "x": "a35ead88", "n": 1, "i": 76}, {"t": "section", "h": "Communication styles | أساليب التواصل", "n": 1, "i": 77}, {"t": "learn", "h": "<div class=\"u\">Cultures have patterns of expression and rules of interaction that reflect their norms and values. Misunderstanding these communication styles can lead to confusion, anxiety and conflict.</div><div class=\"u\">الثقافات ليها أنماط تعبير وقواعد تفاعل بتعكس معاييرها وقيمها. سوء فهم أساليب التواصل دي ممكن يودّي للخبطة وقلق وصراع.</div>", "x": "a46907b0", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">Two key pairs of styles: direct versus indirect, and attached versus detached.</div><div class=\"u\">زوجين أساسيين من الأساليب: المباشر في مقابل غير المباشر، والعاطفي في مقابل المحايد.</div>", "x": "315d264e", "n": 1, "i": 79}, {"t": "learn", "h": "<div class=\"u\">Direct style: straightforward, no beating about the bush, avoiding ambiguity.</div><div class=\"u\">الأسلوب المباشر: على طول، من غير لف ودوران، وتجنّب الغموض.</div>", "x": "5301e49e", "n": 1, "i": 80}, {"t": "learn", "h": "<div class=\"u\">Indirect style: meaning conveyed by subtle means, stories, and frequent use of implication.</div><div class=\"u\">الأسلوب غير المباشر: المعنى بيوصل بطرق غير مباشرة، وحكايات، واستخدام كتير للتلميح.</div>", "x": "24f2b92a", "n": 1, "i": 81}, {"t": "tf", "q": "In a direct communication style, meaning is conveyed by subtle means, stories, and frequent use of implication.<br>في أسلوب التواصل المباشر، المعنى بيوصل بطرق غير مباشرة وحكايات وتلميحات كتير.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Direct means plain. | غلط: المباشر يعني صريح.", "Correct. | صح."], "h": "", "n": 1, "i": 82}, {"t": "learn", "h": "<div class=\"u\">Attached style: communicating with feeling and emotion; subjectivity is valued, and sharing your values and feelings about issues is desirable.</div><div class=\"u\">الأسلوب العاطفي: تواصل بإحساس وانفعال؛ الذاتية متقدّرة، ومشاركة قيمك ومشاعرك عن المواضيع حاجة مرغوبة.</div>", "x": "f1f9ad81", "n": 1, "i": 83}, {"t": "learn", "h": "<div class=\"u\">Detached style: communication should be calm and impersonal; objectivity is valued, and emotional, expressive communication is seen as immature or biased.</div><div class=\"u\">الأسلوب المحايد: التواصل المفروض يبقى هادي وغير شخصي؛ الموضوعية متقدّرة، والتواصل العاطفي المعبّر بيتشاف كعدم نضج أو تحيّز.</div>", "x": "e5aeb92f", "n": 1, "i": 84}, {"t": "section", "h": "Differences two | اختلافات اتنين", "n": 1, "i": 85}, {"t": "learn", "h": "<div class=\"u\">Motivation and memorisation: you will already be thinking of many ways to motivate students, and in the main they will work.</div><div class=\"u\">الدافع والحفظ: أكيد بتفكّر في طرق كتير لتحفيز الطلبة، وفي الغالب هتشتغل.</div>", "x": "ce459fc0", "n": 1, "i": 86}, {"t": "learn", "h": "<div class=\"u\">But in many schools in China and Taiwan, learning strategies rest entirely on memorisation. The greatest motivator is exam success, based on how much students can remember.</div><div class=\"u\">بس في مدارس كتير في الصين وتايوان، استراتيجيات التعلّم مبنية كلها على الحفظ. أكبر حافز هو النجاح في الامتحانات، على قد ما الطلبة فاكرين.</div>", "x": "ae319532", "n": 1, "i": 87}, {"t": "learn", "h": "<div class=\"u\">Writing: in many cultures, students are not encouraged to express their opinions and ideas, and they may bring little creative writing experience from their native language.</div><div class=\"u\">الكتابة: في ثقافات كتير، الطلبة مابيتشجّعوش يعبّروا عن آرائهم وأفكارهم، وممكن مايكونش عندهم خبرة كتابة إبداعية من لغتهم الأم.</div>", "x": "71dad4a2", "n": 1, "i": 88}, {"t": "learn", "h": "<div class=\"u\">Interrupting: in some cultures, several students talking over each other is normal, whereas others will wait until there is complete silence before making their contribution.</div><div class=\"u\">المقاطعة: في ثقافات، كذا طالب بيتكلّموا فوق بعض حاجة عادية، في حين تانيين بيستنّوا صمت كامل قبل ما يشاركوا.</div>", "x": "83b9c8ce", "n": 1, "i": 89}, {"t": "learn", "h": "<div class=\"u\">Volume: the pitch people use for normal conversation varies widely, even among subcultures.</div><div class=\"u\">علو الصوت: درجة الصوت العادية في الكلام بتتفاوت بشكل كبير، حتى بين الثقافات الفرعية.</div>", "x": "2f0e9373", "n": 1, "i": 90}, {"t": "learn", "h": "<div class=\"u\">A learner is at a disadvantage if speaking too softly or too loudly is viewed negatively by you.</div><div class=\"u\">المتعلم في ورطة لو الكلام الهادي جدًا أو العالي جدًا بيتشاف منك بشكل سلبي.</div>", "x": "bac5b9f7", "n": 1, "i": 91}, {"t": "learn", "h": "<div class=\"u\">Autonomy: you will tell students to take charge of their learning, that you are a helper and guide rather than the source of knowledge and authority.</div><div class=\"u\">الاستقلالية: هتقول لطلبتك يمسكوا زمام تعلّمهم، إنك مساعد ومرشد مش مصدر المعرفة والسلطة.</div>", "x": "fb508d66", "n": 1, "i": 92}, {"t": "learn", "h": "<div class=\"u\">Yet these wishes may not fit the educational traditions of different cultures.</div><div class=\"u\">بس الأمنيات دي ممكن ماتناسبش التقاليد التعليمية لثقافات مختلفة.</div>", "x": "94936d2e", "n": 1, "i": 93}, {"t": "learn", "h": "<div class=\"u\">Movement in class: if you are used to walking about the room to monitor and crouching down to help a student, and the culture views this as offensive, it is your responsibility to modify your technique.</div><div class=\"u\">الحركة في الفصل: لو متعود تمشي في الأوضة تراقب وتقرفص تساعد طالب، والثقافة بتشوف ده إساءة، مسؤوليتك انت إنك تعدّل أسلوبك.</div>", "x": "a407ab38", "n": 1, "i": 94}, {"t": "section", "h": "Summary and handling issues | الخلاصة والتعامل مع المشاكل", "n": 1, "i": 95}, {"t": "learn", "h": "<div class=\"u\">Summary: be aware of culture at all times, and increase your learning of culture in the classroom.</div><div class=\"u\">الخلاصة: كن واعي بالثقافة طول الوقت، وزوّد تعلّمك عن الثقافة في الفصل.</div>", "x": "a7f8d3a4", "n": 1, "i": 96}, {"t": "learn", "h": "<div class=\"u\">If ever asked about any subject suggested as taboo, simply reply: I'm sorry. I'm a guest here in your country and I don't think I'm in any position to comment.</div><div class=\"u\">لو حد سألك أبدًا عن أي موضوع من التابوهات، رد ببساطة: آسف. أنا ضيف هنا في بلدكم ومش في موقع يسمحلي أعلّق.</div>", "x": "eafa6511", "n": 1, "i": 97}, {"t": "learn", "h": "<div class=\"u\">If a cultural issue comes up in class, go into your memory bank and decide if it is one of the areas mentioned above, like religion, politics or democracy.</div><div class=\"u\">لو قامت قضية ثقافية في الفصل، ارجع لمخزون ذاكرتك وحدّد لو دي واحدة من المناطق اللي فوق، زي الدين أو السياسة أو الديمقراطية.</div>", "x": "4f2e2ce2", "n": 1, "i": 98}, {"t": "learn", "h": "<div class=\"u\">If it is, it is closing time: close down the conversation or debate straight away, and do it courteously.</div><div class=\"u\">لو آه، يبقى وقت القفل: اقفل النقاش أو الجدال فورًا، واعملها بأدب.</div>", "x": "9aeb9576", "n": 1, "i": 99}, {"t": "mc", "q": "Two students start a heated debate about politics in your class. The unit advises:<br>طالبين بدأوا جدال سخن عن السياسة في فصلك. الوحدة بتنصح:", "opts": ["close it courteously, empathise, and suggest they continue outside | اقفله بأدب، تعاطف، واقترح يكمّلوه برّه", "let it run like a discussion about food | تسيّبه يمشي زي نقاش عن الأكل", "join in and explain the correct side | تشارك وتشرح الطرف الصح"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Politics is taboo. | غلط: السياسة تابو.", "No. Stay out of it. | غلط: ابعد عن المشاركة."], "h": "", "n": 1, "i": 100}, {"t": "learn", "h": "<div class=\"u\">Empathise with the students involved: their point is important, worrying, concerning, whatever emotion they state. Then state that you need to move on.</div><div class=\"u\">تعاطف مع الطلبة المعنيين: نقطتهم مهمة ومقلقة ومحيّرة، أيًا كان الإحساس المعبَّر عنه. وبعدين قول إنك محتاج تكمّل.</div>", "x": "7b8397d8", "n": 1, "i": 101}, {"t": "learn", "h": "<div class=\"u\">Say something like: I'm sorry everybody, we'll need to move on. We've got lots to cover. I suggest the two of you continue the discussion outside the classroom. Right, where were we?</div><div class=\"u\">قول حاجة زي: آسف يا جماعة، لازم نكمّل. عندنا حاجات كتير نغطّيها. أقترح إنكوا الاتنين تكمّلوا النقاش برّه الفصل. طيب، كنا واقفين فين؟</div>", "x": "2c126bff", "n": 1, "i": 102}, {"t": "learn", "h": "<div class=\"u\">But if it is a general discussion about superstitions, or what foods are eaten in different countries, and appropriate areas like these, let it run for a bit: real communication is taking place.</div><div class=\"u\">بس لو ده نقاش عام عن التُخَرُفات أو الأكلات في البلاد المختلفة ومناطق آمنة زي دي، سيّبه يمشي شوية: ده تواصل حقيقي بيحصل.</div>", "x": "c2a870f4", "n": 1, "i": 103}, {"t": "tf", "q": "Foods eaten in different countries is deemed an inappropriate topic for discussion in various countries.<br>الأكلات في البلاد المختلفة بتتعتبر موضوع نقاش غير مناسب في دول كتير.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Food talk is safe. | غلط: كلام الأكل آمن.", "Correct. | صح."], "h": "", "n": 1, "i": 104}, {"t": "learn", "h": "<div class=\"u\">Keep your eyes and ears open all the time for inappropriate discussion topics starting, and head them off at the pass quickly.</div><div class=\"u\">خلّي عينيك وودانك مفتوحين طول الوقت لأي مواضيع نقاش غير مناسبة بتبدأ، واقطعها من أولها بسرعة.</div>", "x": "86031c0f", "n": 1, "i": 105}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 106}, {"t": "learn", "h": "<div class=\"u\">appropriateness: whether a word or act fits its context.</div><div class=\"u\">الملاءمة: هل الكلمة أو الفعل مناسب لسياقه.</div>", "x": "6dc39fe4", "n": 1, "i": 107}, {"t": "learn", "h": "<div class=\"u\">cultural contextualisation: matching language to the culture's norms.</div><div class=\"u\">السياق الثقافي: مطابقة اللغة لمعايير الثقافة.</div>", "x": "677d5358", "n": 1, "i": 108}, {"t": "learn", "h": "<div class=\"u\">sociocultural norms: a society's shared rules for behaviour.</div><div class=\"u\">المعايير الاجتماعية والثقافية: قواعد المجتمع المشتركة للسلوك.</div>", "x": "ae0ebc7c", "n": 1, "i": 109}, {"t": "learn", "h": "<div class=\"u\">taboo: a word or topic that polite conversation avoids.</div><div class=\"u\">التابو: كلمة أو موضوع الكلام المهذب بيتجنّبه.</div>", "x": "ee4a16b6", "n": 1, "i": 110}, {"t": "learn", "h": "<div class=\"u\">stereotyping: assuming all members of a group are the same.</div><div class=\"u\">الصورة النمطية: افتراض إن كل أفراد المجموعة زي بعض.</div>", "x": "31fbb94a", "n": 1, "i": 111}, {"t": "learn", "h": "<div class=\"u\">proxemics: cultural rules for distance between speakers.</div><div class=\"u\">القُربيات: قواعد الثقافة للمسافة بين المتكلمين.</div>", "x": "b1bd2359", "n": 1, "i": 112}, {"t": "learn", "h": "<div class=\"u\">direct style: straightforward talk without ambiguity.</div><div class=\"u\">الأسلوب المباشر: كلام صريح من غير غموض.</div>", "x": "3891f06d", "n": 1, "i": 113}, {"t": "learn", "h": "<div class=\"u\">indirect style: meaning carried by stories and implication.</div><div class=\"u\">الأسلوب غير المباشر: المعنى بحكايات وتلميحات.</div>", "x": "4775fe11", "n": 1, "i": 114}, {"t": "learn", "h": "<div class=\"u\">attached style: emotional, personal communication.</div><div class=\"u\">الأسلوب العاطفي: تواصل انفعالي وشخصي.</div>", "x": "c1be00f7", "n": 1, "i": 115}, {"t": "write", "q": "Your new class abroad stays silent whenever you ask a question. What might be happening, and what do you do? (3-4 sentences)<br>فصلك الجديد في الخارج بيسكت كل ما تسأل سؤال. إيه اللي ممكن يكون بيحصل، وتعمل إيه؟ (٣-٤ جمل).", "key": "tefl-64:1", "a": "The silence may not be boredom or refusal; in some cultures it signals respect and willingness to learn, and in places like Japan reflection before answering is encouraged. I would not judge the class by my own cultural background, and I would remember that in some cultures questioning the teacher feels disrespectful. I would give students longer to respond, since standards for response time differ, and use pair work so participation feels safer. Gradually I would show, gently and without pressure, that questions are welcome in my classroom.<br>الصمت ممكن ميكونش ملل أو رفض؛ في ثقافات معينة ده بيعبّر عن احترام ورغبة في التعلّم، وفي أماكن زي اليابان التأمّل قبل الإجابة متشجَّع. مش هحكم على الفصل على أساس خلفيتي الثقافية، وهفتكر إن في ثقافات سؤال المدرس بيحسّ بعدم احترام. هدي الطلبة وقت أطول للرد، لأن معايير وقت الرد مختلفة، وهستخدم شغل أزواج عشان المشاركة تحس بالأمان. وبشكل تدريجي هورّي، بلطف ومن غير ضغط، إن الأسئلة مرحّب بيها في فصلي.", "h": "", "n": 1, "i": 116}, {"t": "learn", "h": "<div class=\"u\">detached style: calm, impersonal, objective communication.</div><div class=\"u\">الأسلوب المحايد: تواصل هادي وغير شخصي وموضوعي.</div>", "x": "3c4d342a", "n": 1, "i": 117}, {"t": "section", "h": "Final summary | الخلاصة الأخيرة", "n": 1, "i": 118}, {"t": "learn", "h": "<div class=\"u\">Appropriateness means knowing when a word fits: common or rare, taboo, written or spoken, formal or informal. Weep and cry differ exactly this way.</div><div class=\"u\">الملاءمة معناها تعرف إمتى الكلمة تناسب: منتشرة أو نادرة، تابو، مكتوبة أو منطوقة، رسمية أو غير رسمية. weep و cry بيختلفوا بالظبط كده.</div>", "x": "4aef84ed", "n": 1, "i": 119}, {"t": "mc", "q": "The best way to prepare learners for cross-linguistic problems is to:<br>أحسن طريقة تجهّز بيها المتعلمين للمشاكل بين اللغات هي إنك:", "opts": ["teach which words are common, rare or taboo, and formal or informal | تعلّمهم أنهي كلمات منتشرة أو نادرة أو تابو، ورسمية أو غير رسمية", "let them repeat mistakes until natives complain | تسيّبهم يكرّروا الأغلاط لحد ما أصحاب اللغة يتضايقوا", "teach denotation only, context is extra | تعلّم المعنى المباشر بس، والسياق زيادة"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Repetition breeds negative views. | غلط: التكرار بيخلق نظرة سلبية.", "No. Context is the lesson. | غلط: السياق هو الدرس."], "h": "", "n": 1, "i": 120}, {"t": "learn", "h": "<div class=\"u\">Communication is culture bound; cultures vary internally; avoid stereotyping, and notice similarities, not only differences.</div><div class=\"u\">التواصل مرتبط بالثقافة؛ الثقافات متنوّعة من جوه؛ تجنّب الصور النمطية، ولاحظ التشابهات مش بس الاختلافات.</div>", "x": "4577d985", "n": 1, "i": 121}, {"t": "learn", "h": "<div class=\"u\">Expectations differ on both sides: formality, correction, silence, questions, gender, age and status. Research before you start.</div><div class=\"u\">التوقّعات مختلفة عند الطرفين: الرسمية، التصحيح، الصمت، الأسئلة، النوع، السن والمكانة. ابحث قبل ما تبدأ.</div>", "x": "4dc6fdc3", "n": 1, "i": 122}, {"t": "learn", "h": "<div class=\"u\">Behaviours differ too: gestures, reflection time, distance, eye contact, participation, communication styles, memorisation, writing, interrupting, volume, autonomy and movement.</div><div class=\"u\">السلوكيات كمان مختلفة: الإيماءات، وقت التأمّل، المسافة، النظر في العين، المشاركة، أساليب التواصل، الحفظ، الكتابة، المقاطعة، علو الصوت، الاستقلالية والحركة.</div>", "x": "b13dfd22", "n": 1, "i": 123}, {"t": "recall", "q": "Name six cultural differences that can come up in class.<br>اذكر ست اختلافات ثقافية ممكن تظهر في الفصل.", "a": "Any six of: expectations of formality and correction; what silence means; whether questions are welcome; gender, age and status rules; gestures; impulsiveness versus reflection; proxemics; eye contact; active participation; direct/indirect and attached/detached styles; memorisation; writing experience; interrupting; volume; autonomy; and movement in class.<br>أي ستة من: توقّعات الرسمية والتصحيح؛ معنى الصمت؛ هل الأسئلة مرحّب بيها؛ قواعد النوع والسن والمكانة؛ الإيماءات؛ الاندفاع في مقابل التأمّل؛ القُربيات؛ التواصل البصري؛ المشاركة النشطة؛ أساليب مباشر/غير مباشر وعاطفي/محايد؛ الحفظ؛ خبرة الكتابة؛ المقاطعة؛ علو الصوت؛ الاستقلالية؛ والحركة في الفصل.", "h": "", "n": 1, "i": 124}, {"t": "learn", "h": "<div class=\"u\">Avoid taboo topics; close dangerous debates courteously, empathise and move on; let safe cultural discussions run, and finish the course proud.</div><div class=\"u\">تجنّب التابوهات؛ اقفل الجدالات الخطرة بأدب، تعاطف وكمّل؛ سيّب النقاشات الثقافية الآمنة تمشي، واخلص الكورس وانت فخور.</div>", "x": "609e39b9", "n": 1, "i": 125}, {"t": "write", "q": "Why should a teacher research gender, age and status rules before starting with a new group? (3-4 sentences)<br>ليه المدرس المفروض يبحث قواعد النوع والسن والمكانة قبل ما يبدأ مع مجموعة جديدة؟ (٣-٤ جمل).", "key": "tefl-64:2", "a": "Because learners may never have experienced mixed groupings, and group configurations or role plays could clash with native cultural constraints. In some cultures women have historically been kept from active participation in mixed settings, and students may react badly when lower-status members are interrupted or corrected. Some students feel they cannot interrupt older, high-status or male classmates, and are shocked when a teacher ignores such distinctions. Researching first lets me plan activities that respect these rules instead of breaking them by accident.<br>لأن المتعلمين ممكن ميكونوش جرّبوا مجموعات مختلطة أبدًا، وتشكيلات المجموعات أو لعب الأدوار ممكن تتصادم مع القيود الثقافية الأصلية. في ثقافات معينة الستات تاريخيًا ممنوعين من المشاركة النشطة في الأماكن المختلطة، والطلبة ممكن يردّوا بشكل سيء لما الأعضاء الأقل مكانة يتقاطعوا أو يتصحّحوا. بعض الطلبة حاسين إنهم ميقدروش يقاطعوا زمايلهم الأكبر أو الأعلى مكانة أو الولاد، وبيتصادموا لما مدرس يتجاهل الفروق دي. البحث الأولاني بيخلّيني أخطّط أنشطة بتحترم القواعد دي بدل ما أكسرها بالغلط.", "h": "", "n": 1, "i": 126}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 127}];</script>
