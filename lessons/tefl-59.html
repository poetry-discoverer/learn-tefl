<script>window.LESSON_ID="tefl-59";window.STEPS=[{"t": "section", "h": "Why drama | ليه الدراما", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit four: drama. Drama provides opportunities for multi-sensory, kinaesthetic, movement-based responses to stories.</div><div class=\"u\">الوحدة الرابعة: الدراما. الدراما بتوّلي فرص لردود متعددة الحواس وحركية، مبنية على الحركة، على القصص.</div>", "a": "tefl-59-001", "x": "44c5f729", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">It engages children in learning by doing, at a number of different levels.</div><div class=\"u\">بتشرك الأطفال في التعلّم بالعمل، على كذا مستوى مختلف.</div>", "a": "tefl-59-002", "x": "b44ab5a4", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">Dramatization of a story involves several skills which are useful in learning a new language.</div><div class=\"u\">تمثيل قصة بيشتمل على كذا مهارة مفيدة في تعلّم لغة جديدة.</div>", "a": "tefl-59-003", "x": "9a173b27", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">It involves, first, listening to the story. Next, students may respond and engage by asking questions, to make sure they understand the meaning of all of the language.</div><div class=\"u\">بيشتمل، أولًا، على الاستماع للقصة. بعدين، الطلبة ممكن يردّوا ويتفاعلوا بأسئلة، عشان يتأكدوا إنهم فاهمين معنى كل اللغة.</div>", "a": "tefl-59-004", "x": "48cb48b5", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">Word association with actions is a natural part of the learning process.</div><div class=\"u\">ربط الكلمات بالحركات جزء طبيعي من عملية التعلّم.</div>", "a": "tefl-59-005", "x": "a91aded0", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Memorization, usually a boring but necessary part of learning, becomes more interesting and dynamic.</div><div class=\"u\">الحفظ، اللي عادة جزء ممل لكن ضروري من التعلّم، بيبقى أمتع وأكثر حركة.</div>", "a": "tefl-59-006", "x": "939be551", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Finally, they are able to demonstrate their understanding of the language with gestures, sounds, imitation and miming of the story.</div><div class=\"u\">وأخيرًا، بيقدروا يظهّروا فهمهم للغة بالإيماءات والأصوات والتقليد والتمثيل الصامت للقصة.</div>", "a": "tefl-59-007", "x": "136a0733", "n": 1, "i": 7}, {"t": "section", "h": "Puppets and plays | الدمى والمسرحيات", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">A natural extension of dramatizing is to re-tell a story through another medium, such as using puppets.</div><div class=\"u\">امتداد طبيعي للتمثيل هو إعادة حكاية القصة من خلال وسيط تاني، زي استخدام الدمى.</div>", "a": "tefl-59-008", "x": "b23b567d", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">This is an effective way to recycle a story via a fresh perspective.</div><div class=\"u\">دي طريقة مؤثرة تعيد تدوير القصة من منظور جديد.</div>", "a": "tefl-59-009", "x": "bf9eeeb2", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">For shy children, a puppet show is a great option to boost their confidence, because the spotlight is on the puppet rather than on themselves.</div><div class=\"u\">للأطفال الخجولين، عرض الدمى اختيار عظيم يعزّز ثقتهم، لأن الضوء على الدمية مش عليهم هما.</div>", "a": "tefl-59-010", "x": "da29b8a8", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">A play or performance can also be a special way to enjoy using drama as part of the learning process.</div><div class=\"u\">المسرحية أو العرض ممكن كمان يبقى طريقة مميزة للاستمتاع بالدراما كجزء من عملية التعلّم.</div>", "a": "tefl-59-011", "x": "2643c27e", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">It can be highly motivational for students, and encourage them to work even harder at their language development, knowing they will perform in front of parents or peers.</div><div class=\"u\">ممكن تبقى محفّزة جدًا للطلبة، وتشجّعهم يشتغلوا أكتر على تطوير لغتهم، عارفين إنهم هيمثّلوا قدّام أهاليهم أو زمايلهم.</div>", "a": "tefl-59-012", "x": "e6347777", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">For everyone involved, teacher, students and audience, it is a very rewarding experience.</div><div class=\"u\">لكل حد مشارك، المدرس والطلبة والجمهور، دي تجربة مجزية جدًا.</div>", "a": "tefl-59-013", "x": "4084b950", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">A class coalesces with a sense of identity, unified in a collective performance, with peers relying upon one another for ultimate success.</div><div class=\"u\">الفصل بيتلاحم بإحساس بالهوية، متّحد في أداء جماعي، الزمايل فيه بيعتمدوا على بعض للنجاح النهائي.</div>", "a": "tefl-59-014", "x": "9fe8b1b9", "n": 1, "i": 15}, {"t": "section", "h": "Managing drama | إدارة الدراما", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Managing drama activities. It is common for children to experience anxiety and stage-fright when faced with the prospect of performing in front of others.</div><div class=\"u\">إدارة أنشطة الدراما. من الطبيعي إن الأطفال يحسّوا بقلق ورهبة المسرح لما يواجهوا احتمال الأداء قدّام ناس.</div>", "a": "tefl-59-015", "x": "d831f129", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Therefore, it is important to gradually build confidence before introducing drama.</div><div class=\"u\">علشان كده، مهم تبني الثقة بالتدريج قبل ما تقدّم الدراما.</div>", "a": "tefl-59-016", "x": "3fd17afb", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Use stage direction cues like: Action! or: Freeze! to control the students when conducting drama activities.</div><div class=\"u\">استخدم إشارات إخراج زي: أكشن! أو: فريز! عشان تتحكّم في الطلبة وأنت بتدير أنشطة الدراما.</div>", "a": "tefl-59-017", "x": "a26ac97f", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Remember that students look to a teacher as a role model. So, do not just direct from the side-lines!</div><div class=\"u\">افتكر إن الطلبة بيبصّوا للمدرس كقدوة. فماتوجّهش بس من الخط الجانبي!</div>", "a": "tefl-59-018", "x": "5d331079", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Teacher participation in the drama is very important, and serves as a way to model the response you expect from your students.</div><div class=\"u\">مشاركة المدرس في الدراما مهمة جدًا، وبتعتبر طريقة تنمذج الرد اللي متوقّعه من طلبتك.</div>", "a": "tefl-59-019", "x": "d9c3177a", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">This also helps prevent the students from developing that uncomfortable feeling of being watched and judged.</div><div class=\"u\">ده كمان بيساعد يمنع الطلبة من الإحساس المضايق إنهم متفرّج عليهم وبيتقيّموا.</div>", "a": "tefl-59-020", "x": "47208def", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">If the teacher is also performing, students will feel freer in their expressive movements.</div><div class=\"u\">لو المدرس كمان بيمثّل، الطلبة هيحسّوا بحرية أكتر في حركاتهم التعبيرية.</div>", "a": "tefl-59-021", "x": "598d4b0f", "n": 1, "i": 23}, {"t": "section", "h": "Reflection questions | أسئلة التأمّل", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Module reflection questions. After using storytelling and drama with your classes, think about these questions to evaluate how things went and plan improvements.</div><div class=\"u\">أسئلة تأمّل الوحدة. بعد ما تستخدم سرد القصص والدراما مع فصولك، فكّر في الأسئلة دي عشان تقيّم إزاي الأمور مشيت وتخطّط تحسينات.</div>", "a": "tefl-59-022", "x": "4582e503", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Interest: Did the story engage the children's curiosity, interest and attention? Why or why not? If so, how was this sustained?</div><div class=\"u\">الاهتمام: هل القصة شركت فضول واهتمام وانتباه الأطفال؟ ليه أو ليه لأ؟ ولو أيوه، إزاي ده استمر؟</div>", "a": "tefl-59-023", "x": "3806e2a7", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Participation: Did the children participate actively? What factors encouraged, or discouraged, this?</div><div class=\"u\">المشاركة: هل الأطفال شاركوا بنشاط؟ إيه العوامل اللي شجّعت، أو ثبّطت، ده؟</div>", "a": "tefl-59-024", "x": "c804e138", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Creative thinking: How did the children respond to activities inviting a creative or imaginative response? Did this affect the way they used language? How?</div><div class=\"u\">التفكير الإبداعي: الأطفال ردّوا إزاي على الأنشطة اللي بتطلب رد إبداعي أو تخيّلي؟ هل ده أثّر على طريقة استخدامهم للغة؟ إزاي؟</div>", "a": "tefl-59-025", "x": "0db9d940", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Kinaesthetic learning: How did the children respond to activities involving mime and movement? In what ways did these help or detract from learning, and why?</div><div class=\"u\">التعلّم الحركي: الأطفال ردّوا إزاي على أنشطة التمثيل الصامت والحركة؟ بطرق إيه ساعدت أو نقّصت من التعلّم، وليه؟</div>", "a": "tefl-59-026", "x": "ef7e4a2f", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Collaboration: Did the children collaborate and work well together? What factors influenced this?</div><div class=\"u\">التعاون: هل الأطفال تعاونوا واشتغلوا كويس مع بعض؟ إيه العوامل اللي أثّرت في ده؟</div>", "a": "tefl-59-027", "x": "cf54427d", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Enjoyment: Did the children enjoy the story and related activities? What effect did this have on their motivation, confidence and self-esteem?</div><div class=\"u\">المتعة: هل الأطفال استمتعوا بالقصة وأنشطتها؟ إيه تأثير ده على دافعهم وثقتهم واحترامهم لذاتهم؟</div>", "a": "tefl-59-028", "x": "c12ab06d", "n": 1, "i": 31}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 32}, {"t": "learn", "h": "<div class=\"u\">kinaesthetic learning: learning through movement and doing.</div><div class=\"u\">التعلّم الحركي: التعلّم من خلال الحركة والعمل.</div>", "a": "tefl-59-029", "x": "5013831a", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">dramatization: turning a story into acted scenes.</div><div class=\"u\">التمثيل الدرامي: تحويل القصة لمشاهد ممثّلة.</div>", "a": "tefl-59-030", "x": "5590435d", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">mime: acting without words, using the body only.</div><div class=\"u\">التمثيل الصامت: تمثيل من غير كلام، بالجسم بس.</div>", "a": "tefl-59-031", "x": "2819f9b1", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">puppets: dolls moved by hand to retell a story.</div><div class=\"u\">الدمى: عرايس بتتحرّك بالإيد لإعادة حكاية قصة.</div>", "a": "tefl-59-032", "x": "a99ff60e", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">stage-fright: fear of performing in front of others.</div><div class=\"u\">رهبة المسرح: خوف من الأداء قدّام ناس.</div>", "a": "tefl-59-033", "x": "7a620a1e", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">stage direction cues: commands like Action! and Freeze!.</div><div class=\"u\">إشارات الإخراج: أوامر زي أكشن! وفريز!.</div>", "a": "tefl-59-034", "x": "c71b72b6", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">role model: a person others copy and look up to.</div><div class=\"u\">القدوة: شخص الناس بتقلّده وتحتذي بيه.</div>", "a": "tefl-59-035", "x": "c2ef0b40", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">multi-sensory: using many senses at once.</div><div class=\"u\">متعدد الحواس: بيستخدم حواس كتير في نفس الوقت.</div>", "a": "tefl-59-036", "x": "51a60528", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">word association: linking a word to an action or image.</div><div class=\"u\">ربط الكلمات: توصيل الكلمة بحركة أو صورة.</div>", "a": "tefl-59-037", "x": "7534c9b0", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">collective performance: a show the whole class does together.</div><div class=\"u\">الأداء الجماعي: عرض الفصل كله بيعمله مع بعض.</div>", "a": "tefl-59-038", "x": "3eca08bd", "n": 1, "i": 42}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Drama gives multi-sensory, movement-based learning by doing: listen, question, associate words with actions, memorize dynamically, then show meaning with gesture and mime.</div><div class=\"u\">الدراما بتدّي تعلّم بالعمل متعدد الحواس وحركي: اسمع واسأل واربط الكلمات بالحركات واحفظ بشكل حي، وبعدين اظهِر المعنى بالإيماءة والتمثيل الصامت.</div>", "a": "tefl-59-039", "x": "7ae7f634", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Puppets recycle stories and give shy children confidence, because the spotlight is on the puppet, not on them.</div><div class=\"u\">الدمى بتعيد تدوير القصص وبتدّي الأطفال الخجولين ثقة، لأن الضوء على الدمية مش عليهم.</div>", "a": "tefl-59-040", "x": "cfab9bae", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">A play for parents or peers is highly motivational, and unifies the class in a collective performance where peers rely on each other.</div><div class=\"u\">المسرحية قدّام الأهالي أو الزمايل محفّزة جدًا، وبتلمّ الفصل في أداء جماعي الزمايل فيه بيعتمدوا على بعض.</div>", "a": "tefl-59-041", "x": "336837c6", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Manage drama by building confidence gradually, using Action! and Freeze! cues, and joining in yourself as a role model, so children never feel watched and judged.</div><div class=\"u\">دير الدراما ببناء الثقة بالتدريج، واستخدام إشارات أكشن! وفريز!، وشارك بنفسك كقدوة، عشان الأطفال ماتحسّش أبدًا إنهم متفرّج عليهم وبيتقيّموا.</div>", "a": "tefl-59-042", "x": "c627a31b", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">After storytelling and drama, reflect on interest, participation, creative thinking, kinaesthetic learning, collaboration and enjoyment, and plan improvements.</div><div class=\"u\">بعد سرد القصص والدراما، تأمّل في الاهتمام والمشاركة والتفكير الإبداعي والتعلّم الحركي والتعاون والمتعة، وخطّط تحسينات.</div>", "a": "tefl-59-043", "x": "954085ae", "n": 1, "i": 48}, {"t": "mc", "q": "Drama engages children in learning by:<br>الدراما بتشرك الأطفال في التعلّم عن طريق:", "opts": ["doing, at many different levels | العمل، على مستويات مختلفة كتير", "silent reading only | القراية الصامتة بس", "copying from the board | النقل من السبورة"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Drama is active. | غلط: الدراما نشطة.", "No. Copying is passive. | غلط: النقل سلبي."], "h": "", "n": 1, "i": 49}, {"t": "mc", "q": "Why are puppets especially good for shy children?<br>ليه الدمى كويسة خصوصًا للأطفال الخجولين؟", "opts": ["the spotlight is on the puppet, not on them | الضوء على الدمية مش عليهم", "puppets are cheaper than books | الدمى أرخص من الكتب", "puppets need no language | الدمى مش محتاجة لغة"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. It is about confidence. | غلط: الموضوع عن الثقة.", "No. Puppets retell the story's language. | غلط: الدمى بتحكي لغة القصة."], "h": "", "n": 1, "i": 50}, {"t": "tf", "q": "The teacher should direct drama from the side-lines and never join in.<br>المدرس المفروض يوجّه الدراما من الخط الجانبي وميشاركش أبدًا.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Join in and model. | غلط: شارك ونمذج.", "Correct. | صح."], "h": "", "n": 1, "i": 51}, {"t": "mc", "q": "Which cues control students during drama activities?<br>أنهي إشارات بتتحكّم في الطلبة أثناء أنشطة الدراما؟", "opts": ["Action! and Freeze! | أكشن! وفريز!", "Sit! and Quiet! | اقعد! واسكت!", "Start! and Stop! | ابدأ! وقِف!"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Those are not stage cues. | غلط: دي مش إشارات مسرحية.", "No. The course names Action and Freeze. | غلط: الكورس بيسمّي أكشن وفريز."], "h": "", "n": 1, "i": 52}, {"t": "mc", "q": "Before introducing drama, you should first:<br>قبل ما تقدّم الدراما، المفروض الأول:", "opts": ["gradually build the children's confidence | تبني ثقة الأطفال بالتدريج", "book a real theatre | تحجز مسرح حقيقي", "invite the parents | تدعو الأهالي"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Confidence comes first. | غلط: الثقة الأول.", "No. The audience comes later. | غلط: الجمهور بييجي بعدين."], "h": "", "n": 1, "i": 53}, {"t": "tf", "q": "Memorization inside drama becomes more interesting and dynamic.<br>الحفظ جوّه الدراما بيبقى أمتع وأكثر حركة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Movement makes memory fun. | غلط: الحركة بتخلي الحفظ ممتع."], "h": "", "n": 1, "i": 54}, {"t": "mc", "q": "A class performance in front of parents makes the class:<br>عرض الفصل قدّام الأهالي بيخلّي الفصل:", "opts": ["coalesce with a shared identity, peers relying on each other | يتلاحم بهوية مشتركة، الزمايل بيعتمدوا على بعض", "compete until friendships break | يتنافس لحد ما الصداقات تتكسر", "care only about the teacher | يهتم بالمدرس بس"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. It unites, not divides. | غلط: بيوحّد مش بيفرّق.", "No. It is a team event. | غلط: ده حدث جماعي."], "h": "", "n": 1, "i": 55}, {"t": "tf", "q": "Word association with actions is a natural part of learning a language.<br>ربط الكلمات بالحركات جزء طبيعي من تعلّم اللغة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Actions anchor words. | غلط: الحركات بتثبّت الكلمات."], "h": "", "n": 1, "i": 56}, {"t": "mc", "q": "Which is NOT one of the six module reflection areas?<br>أنهي واحدة مش من مجالات تأمّل الوحدة الستة؟", "opts": ["homework marking | تصحيح الواجب", "interest | الاهتمام", "collaboration | التعاون"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Interest is one of the six. | غلط: الاهتمام واحد من الستة.", "No. Collaboration is one of the six. | غلط: التعاون واحد من الستة."], "h": "", "n": 1, "i": 57}, {"t": "tf", "q": "Review: it is better to enter class, feel the atmosphere, then decide on classroom rules.<br>مراجعة: الأفضل تدخل الفصل وتحس بالجو وبعدين تقرّر قواعد الفصل.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Go in prepared. | غلط: ادخل محضّر.", "Correct. | صح."], "h": "", "n": 1, "i": 58}, {"t": "tf", "q": "Review: bad behaviour can never be predicted, so just deal with it as it happens.<br>مراجعة: السلوك السيئ مستحيل يتوقّع، فاتعامل معاه لما يحصل بس.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Preparation beats reaction. | غلط: التحضير بيتغلّب على رد الفعل.", "Correct. | صح."], "h": "", "n": 1, "i": 59}, {"t": "tf", "q": "Review: children will always have the ability to misbehave, so be prepared before class.<br>مراجعة: الأطفال عندهم دايمًا القدرة على السلوك السيئ، فكون مستعد قبل الفصل.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Testing the teacher is normal. | غلط: اختبار المدرس طبيعي."], "h": "", "n": 1, "i": 60}, {"t": "tf", "q": "Review: learn the children's names as soon as you can and always use them.<br>مراجعة: اتعلّم أسماء الأطفال بأسرع ما تقدر واستخدمها دايمًا.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Names come first. | غلط: الأسماء الأول."], "h": "", "n": 1, "i": 61}, {"t": "tf", "q": "Review: never be overly critical; encourage children to believe they can succeed.<br>مراجعة: ماتكونش ناقد بزيادة؛ شجّع الأطفال يؤمنوا إنهم يقدروا ينجحوا.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Criticism kills confidence. | غلط: النقد بيموّت الثقة."], "h": "", "n": 1, "i": 62}, {"t": "tf", "q": "Review: always be serious in class, or students will not respect you.<br>مراجعة: خلّيك جاد دايمًا في الفصل، وإلا الطلبة مش هيحترموك.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Fun and respect go together. | غلط: المرح والاحترام بيمشوا مع بعض.", "Correct. | صح."], "h": "", "n": 1, "i": 63}, {"t": "tf", "q": "Review: be fair and firm about enforcing rules and acceptable behaviour.<br>مراجعة: كن عادل وحازم في تطبيق القواعد والسلوك المقبول.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Fair and firm is the rule. | غلط: عادل وحازم هي القاعدة."], "h": "", "n": 1, "i": 64}, {"t": "tf", "q": "Review: if the class gets out of hand, it is OK to bang the desk and shout shut up.<br>مراجعة: لو الفصل خرج عن السيطرة، عادي تخبط على المكتب وتصريخ اسكتوا.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Calm control wins. | غلط: السيطرة الهادية بتكسب.", "Correct. | صح."], "h": "", "n": 1, "i": 65}, {"t": "tf", "q": "Review: a good first rule is: we must always speak English in class.<br>مراجعة: قاعدة أولى كويسة هي: لازم نتكلّم إنجليزي دايمًا في الفصل.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Rules must be attainable. | غلط: القواعد لازم تبقى قابلة للتحقيق.", "Correct. | صح."], "h": "", "n": 1, "i": 66}, {"t": "tf", "q": "Review: a box of chocolates as an incentive is a good idea for the first lesson.<br>مراجعة: علبة شوكولاتة كحافز فكرة كويسة لأول حصة.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. No prizes at the start. | غلط: مافيش جوايز في البداية.", "Correct. | صح."], "h": "", "n": 1, "i": 67}, {"t": "tf", "q": "Review: it does not matter if all children can see the book's pictures, hearing is enough.<br>مراجعة: مش مهم كل الأطفال يشوفوا صور الكتاب، السماع كفاية.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Everyone must see. | غلط: الكل لازم يشوف.", "Correct. | صح."], "h": "", "n": 1, "i": 68}, {"t": "tf", "q": "Review: you can just pick up the book and let the story dictate how you read it.<br>مراجعة: ممكن بس تمسك الكتاب وتسيّب القصة تحدّد إزاي هتقراها.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Rehearsal first. | غلط: التمرين الأول.", "Correct. | صح."], "h": "", "n": 1, "i": 69}, {"t": "tf", "q": "Review: do not stare at children while they perform; it can feel like judging.<br>مراجعة: ماتتحدّقش في الأطفال وهما بيمثّلوا؛ ممكن يحسّوا إنه تقييم.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Perform with them. | غلط: مثّل معاهم."], "h": "", "n": 1, "i": 70}, {"t": "recall", "q": "List the five language-learning skills inside dramatizing a story.<br>عدّد المهارات الخمسة اللي جوّه تمثيل قصة.", "a": "Listening to the story; asking questions to confirm understanding; word association with actions; more dynamic memorization; demonstrating understanding with gestures, sounds, imitation and mime.<br>الاستماع للقصة؛ طرح أسئلة للتأكد من الفهم؛ ربط الكلمات بالحركات؛ حفظ أكثر حركة؛ إظهار الفهم بالإيماءات والأصوات والتقليد والتمثيل الصامت.", "h": "", "n": 1, "i": 71}, {"t": "recall", "q": "Name the six reflection areas for storytelling and drama lessons.<br>اذكر مجالات التأمّل الستة لدروس سرد القصص والدراما.", "a": "Interest, participation, creative thinking, kinaesthetic learning, collaboration and enjoyment.<br>الاهتمام والمشاركة والتفكير الإبداعي والتعلّم الحركي والتعاون والمتعة.", "h": "", "n": 1, "i": 72}, {"t": "write", "q": "How would you introduce drama to a class that has never done it? (3-4 sentences)<br>إزاي هتقدّم الدراما لفصل عمري ما عملها؟ (٣-٤ جمل).", "key": "tefl-59:1", "a": "I would build confidence gradually, because anxiety and stage-fright are common before any performance. I would start small, with mime and movement games linked to a familiar story, using clear cues like Action! and Freeze! so everyone feels safe and controlled. For shy children I would use puppets, because the spotlight falls on the puppet, not on them. Most importantly, I would join in myself as a role model, so the children never feel watched and judged.<br>هبني الثقة بالتدريج، لأن القلق ورهبة المسرح شائعين قبل أي أداء. هبدأ صغير، بألعاب تمثيل صامت وحركة مربوطة بقصة مألوفة، بإشارات واضحة زي أكشن! وفريز! عشان الكل يحس بالأمان والسيطرة. للأطفال الخجولين هستخدم الدمى، لأن الضوء بيقع على الدمية مش عليهم. والأهم، هشارك بنفسي كقدوة، عشان الأطفال ماتحسّش أبدًا إنهم متفرّج عليهم وبيتقيّموا.", "h": "", "n": 1, "i": 73}, {"t": "write", "q": "Why is a class play worth the effort? (3-4 sentences)<br>ليه مسرحية الفصل تستاهل المجهود؟ (٣-٤ جمل).", "key": "tefl-59:2", "a": "A play is highly motivational, because children work harder at their language when they know they will perform in front of parents or peers. It turns memorization, usually boring, into something dynamic and fun. It also unites the class: everyone shares one identity in a collective performance, relying on each other for success. For teacher, students and audience, it is a very rewarding experience.<br>المسرحية محفّزة جدًا، لأن الأطفال بيشتغلوا أكتر على لغتهم لما يعرفوا إنهم هيمثّلوا قدّام أهاليهم أو زمايلهم. بتحوّل الحفظ، اللي عادة ممل، لحاجة حيّة وممتعة. وكمان بتلّم الفصل: الكل بيتقاسم هوية واحدة في أداء جماعي، بيعتمدوا على بعض للنجاح. للمدرس والطلبة والجمهور، دي تجربة مجزية جدًا.", "h": "", "n": 1, "i": 74}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 75}];</script>
