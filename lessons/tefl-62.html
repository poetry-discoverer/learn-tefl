<script>window.LESSON_ID="tefl-62";window.STEPS=[{"t": "section", "h": "More than you think | أكبر مما تفتكر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit three: teacher roles. Why is this unit inside a module called classroom survival tips?</div><div class=\"u\">الوحدة التالتة: أدوار المدرس. ليه الوحدة دي جوّه وحدة اسمها نصايح النجاة في الفصل؟</div>", "x": "9a1965fb", "n": 1, "i": 1, "a": "tefl-62-001"}, {"t": "learn", "h": "<div class=\"u\">Plainly and simply, because there is more to your role than you might think.</div><div class=\"u\">ببساطة ووضوح، لأن دورك أكبر مما تفتكر.</div>", "x": "abfb92ac", "n": 1, "i": 2, "a": "tefl-62-002"}, {"t": "learn", "h": "<div class=\"u\">You have already studied what makes a competent, effective teacher: the knowledge, ability, skills and habits for a successful lesson.</div><div class=\"u\">انت فعلًا درست اللي بيخلّي المدرس كفء ومؤثر: المعرفة والقدرة والمهارات والعادات لحصة ناجحة.</div>", "x": "08b9e070", "n": 1, "i": 3, "a": "tefl-62-003"}, {"t": "learn", "h": "<div class=\"u\">But there are other personal and supervisor-type roles you will be responsible for. They come with the job, as they say.</div><div class=\"u\">بس فيه أدوار تانية شخصية وإشرافية هتبقى مسؤول عنها. زي ما بيقولوا، دي جزء من الشغلانة.</div>", "x": "6a711ff8", "n": 1, "i": 4, "a": "tefl-62-004"}, {"t": "learn", "h": "<div class=\"u\">It would be wonderful if the role were only passing on information and creating an enjoyable atmosphere. It is not as easy as that.</div><div class=\"u\">كان هيبقى رائع لو الدور بس نقل معلومات وخلق جو ممتع. الموضوع مش بالسهولة دي.</div>", "x": "59d17c7b", "n": 1, "i": 5, "a": "tefl-62-005"}, {"t": "learn", "h": "<div class=\"u\">Most inexperienced TEFL teachers give little thought to these roles, and it is a severe shock when they arrive unprepared. You will not be unprepared.</div><div class=\"u\">أغلب مدرسي تيفل الجداد مابيفكّروش في الأدوار دي، وبيصدموا صدمة قوية لما بيوصلوا غير مستعدين. انت مش هتوصل غير مستعد.</div>", "x": "9c9d3c24", "n": 1, "i": 6, "a": "tefl-62-006"}, {"t": "section", "h": "Assessor | المقيّم", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">Role one: the assessor. You assess progress and correct errors.</div><div class=\"u\">الدور الأول: المقيّم. انت بتقيّم التقدّم وبتصحّح الأغلاط.</div>", "x": "22084900", "n": 1, "i": 8, "a": "tefl-62-007"}, {"t": "learn", "h": "<div class=\"u\">You allow students to demonstrate their mastery of the material in different ways, and diagnose what follow-up lessons need.</div><div class=\"u\">بتسمح للطلبة يظهّروا إتقانهم للمادة بطرق مختلفة، وبتشخّص الدروس اللاحقة محتاجة إيه.</div>", "x": "453b11b9", "n": 1, "i": 9, "a": "tefl-62-008"}, {"t": "tf", "q": "As assessor, you allow students to demonstrate mastery in different ways.<br>كمقيّم، بتسمح للطلبة يظهّروا إتقانهم بطرق مختلفة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. That is the assessor's job. | غلط: ده شغل المقيّم."], "h": "", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">You prepare, deliver and mark tests and examinations, and communicate grades, results and progress with sensitivity and support.</div><div class=\"u\">بتحضّر وتدير وتصحّح الاختبارات والامتحانات، وبتنقل الدرجات والنتايج والتقدّم بحساسية ودعم.</div>", "x": "df6d9c14", "n": 1, "i": 11, "a": "tefl-62-009"}, {"t": "learn", "h": "<div class=\"u\">And you ensure you meet any required external standards or inspections.</div><div class=\"u\">وبتتأكد إنك مستوفي أي معايير خارجية أو تفتيش مطلوب.</div>", "x": "923e45a8", "n": 1, "i": 12, "a": "tefl-62-010"}, {"t": "section", "h": "Controller, facilitator, guide | المتحكّم والميسّر والمرشد", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Role two: the controller. You ensure the whole class is tuned into what needs to be done, for example when starting a new activity.</div><div class=\"u\">الدور التاني: المتحكّم. بتتأكد إن الفصل كله مركّز على المطلوب، مثلًا عند بداية نشاط جديد.</div>", "x": "868f6eb8", "n": 1, "i": 14, "a": "tefl-62-011"}, {"t": "tf", "q": "As facilitator, you ensure the whole class is tuned into what needs to be done.<br>كميسّر، بتتأكد إن الفصل كله مركّز على المطلوب.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. That is the controller. | غلط: ده المتحكّم.", "Correct. | صح."], "h": "", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">And you ensure classroom order is maintained.</div><div class=\"u\">وبتتأكد إن نظام الفصل محفوظ.</div>", "x": "d906b66d", "n": 1, "i": 16, "a": "tefl-62-012"}, {"t": "learn", "h": "<div class=\"u\">Role three: the facilitator. Know what facilitation really is.</div><div class=\"u\">الدور التالت: الميسّر. اعرف التيسير معناه إيه بالحقيقة.</div>", "x": "1034da92", "n": 1, "i": 17, "a": "tefl-62-013"}, {"t": "learn", "h": "<div class=\"u\">You step back and let students find their own way along the language journey, while still monitoring and motivating as needed.</div><div class=\"u\">بتتراجع خطوة وبتسيّب الطلبة يلاقوا طريقهم في رحلة اللغة، وانت لسه بتراقب وبتحفّز حسب الحاجة.</div>", "x": "c64ae563", "n": 1, "i": 18, "a": "tefl-62-014"}, {"t": "mc", "q": "Stepping back and letting students find their own way is the role of the:<br>التراجع خطوة وسياب الطلبة يلاقوا طريقهم هو دور:", "opts": ["facilitator | الميسّر", "controller | المتحكّم", "assessor | المقيّم"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. The controller steps in. | غلط: المتحكّم بيتدخّل.", "No. The assessor measures. | غلط: المقيّم بيقيس."], "h": "", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">You stay available and ready to act as a resource when needed.</div><div class=\"u\">بتفضل متاح وجاهز تعمل كمصدر لما يطلبوك.</div>", "x": "51d21172", "n": 1, "i": 20, "a": "tefl-62-015"}, {"t": "learn", "h": "<div class=\"u\">Role four: the guide. You guide those who are unsure of what to do.</div><div class=\"u\">الدور الرابع: المرشد. بترشد اللي مش متأكدين يعملوا إيه.</div>", "x": "720ed0f0", "n": 1, "i": 21, "a": "tefl-62-016"}, {"t": "section", "h": "Manager and materials | المدير والخامات", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Role five: the manager. You handle the nitty-gritty that underpins a successful lesson: effective instructions, the best seating, tasks completed as planned.</div><div class=\"u\">الدور الخامس: المدير. بتدير التفاصيل الصغيرة اللي بتحمل الحصة الناجحة: تعليمات واضحة، أحسن قعدة، مهام بتتخلّص زي الخطة.</div>", "x": "c0b17173", "n": 1, "i": 23, "a": "tefl-62-017"}, {"t": "recall", "q": "What does the manager role handle? Name four things.<br>دور المدير بيدير إيه؟ اذكر أربع حاجات.", "a": "Effective and coherent instructions, the most effective seating, tasks completed as planned, group dynamics for routines and transitions and groupings, and a sense of community and belonging.<br>تعليمات واضحة مترابطة، أحسن قعدة، مهام بتتخلّص زي الخطة، ديناميكية مجموعات للروتين والانتقالات والتجميعات، وإحساس بالمجتمع والانتماء.", "h": "", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">You use group dynamics skills for efficient routines, smooth transitions and varied groupings that encourage specific types of learning.</div><div class=\"u\">بتستخدم مهارات ديناميكية المجموعات لروتين كفء وانتقالات ناعمة وتجميعات متنوعة بتشجّع أنواع معينة من التعلّم.</div>", "x": "232e81f3", "n": 1, "i": 25, "a": "tefl-62-018"}, {"t": "learn", "h": "<div class=\"u\">And you ensure a sense of community and belonging in the classroom.</div><div class=\"u\">وبتضمن إحساس بالمجتمع والانتماء في الفصل.</div>", "x": "193cd895", "n": 1, "i": 26, "a": "tefl-62-019"}, {"t": "learn", "h": "<div class=\"u\">Role six: the materials producer and collector. You produce materials more appropriate, more relevant and often much better than a coursebook offers.</div><div class=\"u\">الدور السادس: منتج وجامع الخامات. بتنتج خامات أنسب وأقرب وغالبًا أحسن بكتير من اللي الكتاب بيقدّمه.</div>", "x": "72e9db4e", "n": 1, "i": 27, "a": "tefl-62-020"}, {"t": "mc", "q": "Bringing real objects into class belongs to the role of:<br>جيب أشياء حقيقية للفصل جزء من دور:", "opts": ["materials producer and collector | منتج وجامع الخامات", "needs analyst | محلّل الاحتياجات", "motivator | المحفّز"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Analysts identify needs. | غلط: المحلّل بيحدّد الاحتياجات.", "No. Motivators energise. | غلط: المحفّز بيحفّز."], "h": "", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">You ensure a variety of mediums: paper and image based, audio and video, and realia where appropriate.</div><div class=\"u\">وبتضمن تنوّع الوسائط: ورق وصور، وصوت وفيديو، وأشياء حقيقية لما يناسب.</div>", "x": "96892bad", "n": 1, "i": 29, "a": "tefl-62-021"}, {"t": "section", "h": "Monitor and motivator | المراقب والمحفّز", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Role seven: the monitor. You observe and analyse ongoing interactions daily: what is going well and what is not.</div><div class=\"u\">الدور السابع: المراقب. بتلاحظ وبتحلّل التفاعلات الجارية يوميًا: إيه اللي ماشي كويس وإيه اللي مش ماشي كويس.</div>", "x": "ebea4d3b", "n": 1, "i": 31, "a": "tefl-62-022"}, {"t": "learn", "h": "<div class=\"u\">You reflect on the evidence and decide what a later feedback session needs, then deliver effective, constructive, timely feedback.</div><div class=\"u\">بتتأمّل في الدليل وبتقرّر جلسة التغذية الراجعة اللاحقة محتاجة إيه، وبعدين بتقدّم تغذية راجعة مؤثرة وبنّاءة وفي وقتها.</div>", "x": "9747ee20", "n": 1, "i": 32, "a": "tefl-62-023"}, {"t": "tf", "q": "As monitor, you reflect on evidence and decide what a later feedback session needs.<br>كمراقب، بتتأمّل في الدليل وبتقرّر جلسة التغذية الراجعة محتاجة إيه.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Reflection drives feedback. | غلط: التأمّل بيقود التغذية الراجعة."], "h": "", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">You also recognise when to act as a counsellor, giving emotional support so learners feel confident.</div><div class=\"u\">وبتعرف كمان إمتى تعمل كمستشار، بتدّي دعم عاطفي عشان المتعلمين يحسّوا بالثقة.</div>", "x": "1f639089", "n": 1, "i": 34, "a": "tefl-62-024"}, {"t": "learn", "h": "<div class=\"u\">Role eight: the motivator. You motivate students who are tired, distracted, or stressed by life outside the classroom.</div><div class=\"u\">الدور التامن: المحفّز. بتحفّز الطلبة التعبانين أو المشتّتين أو المضغوطين من الحياة برّه الفصل.</div>", "x": "d101046e", "n": 1, "i": 35, "a": "tefl-62-025"}, {"t": "learn", "h": "<div class=\"u\">Lessons should be interesting, meaningful and stimulating, responding to emotional, cognitive and linguistic needs.</div><div class=\"u\">الحصص المفروض تبقى ممتعة وذا معنى ومحفّزة، بترد على الاحتياجات العاطفية والمعرفية واللغوية.</div>", "x": "8e3ee151", "n": 1, "i": 36, "a": "tefl-62-026"}, {"t": "learn", "h": "<div class=\"u\">Remember: the whole person comes to school. Yesterday's motivated student may not be motivated today.</div><div class=\"u\">افتكر: الإنسان كله بييجي المدرسة. الطالب المتحمّس بتاع إمبارح ممكن ميبقاش متحمّس النهارده.</div>", "x": "c7980e14", "n": 1, "i": 37, "a": "tefl-62-027"}, {"t": "mc", "q": "Yesterday's motivated student may be unmotivated today. This reminds the teacher as:<br>الطالب المتحمّس بتاع إمبارح ممكن ميبقاش متحمّس النهارده. ده بيفكّر المدرس ك:", "opts": ["motivator, because the whole person comes to school | محفّز، لأن الإنسان كله بييجي المدرسة", "controller, because order matters | متحكّم، لأن النظام مهم", "planner, because plans change | مخطّط، لأن الخطط بتتغيّر"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. This is about motivation. | غلط: ده عن التحفيز.", "No. This is about people, not plans. | غلط: ده عن البشر مش الخطط."], "h": "", "n": 1, "i": 38}, {"t": "section", "h": "Analyst and planner | المحلّل والمخطّط", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Role nine: the needs analyst. You identify the learning needs your learners express.</div><div class=\"u\">الدور التاسع: محلّل الاحتياجات. بتحدّد احتياجات التعلّم اللي المتعلمين بيعبّروا عنها.</div>", "x": "33b5d2e3", "n": 1, "i": 40, "a": "tefl-62-028"}, {"t": "learn", "h": "<div class=\"u\">You account for differing ability levels and varying backgrounds, interests and needs.</div><div class=\"u\">بتحسب حساب مستويات القدرة المختلفة والخلفيات والاهتمامات والاحتياجات المتنوعة.</div>", "x": "89436b0a", "n": 1, "i": 41, "a": "tefl-62-029"}, {"t": "learn", "h": "<div class=\"u\">Learners may have other needs you identify, behavioural or social, but here the term means learning needs.</div><div class=\"u\">المتعلمين ممكن يكون عندهم احتياجات تانية تكتشفها، سلوكية أو اجتماعية، بس هنا المصطلح معناه احتياجات التعلّم.</div>", "x": "87b7d64c", "n": 1, "i": 42, "a": "tefl-62-030"}, {"t": "learn", "h": "<div class=\"u\">Role ten: the planner and organiser. You prepare lesson plans for your class or age group.</div><div class=\"u\">الدور العاشر: المخطّط والمنظّم. بتحضّر خطط الدروس لفصلك أو فئتك العمرية.</div>", "x": "e7f3c963", "n": 1, "i": 43, "a": "tefl-62-031"}, {"t": "mc", "q": "Setting the lesson roadmap and organising every task is the role of the:<br>وضع خريطة طريق الحصة وتنظيم كل مهمة هو دور:", "opts": ["planner and organiser | المخطّط والمنظّم", "guide | المرشد", "monitor | المراقب"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. The guide helps the unsure. | غلط: المرشد بيساعد المحتارين.", "No. The monitor observes. | غلط: المراقب بيلاحظ."], "h": "", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">You embrace a multicultural perspective in planning, and account for maximum student interaction.</div><div class=\"u\">بتتبنّى منظور متعدد الثقافات في التخطيط، وبتحسب حساب أقصى تفاعل بين الطلبة.</div>", "x": "8ae94b18", "n": 1, "i": 45, "a": "tefl-62-032"}, {"t": "learn", "h": "<div class=\"u\">You ensure plentiful authentic, communicative language use, and set out the roadmap: every task and activity organised for every learner.</div><div class=\"u\">وبتضمن استخدام لغة حقيقي تفاعلي وفير، وبتحط خريطة الطريق: كل مهمة ونشاط متنظّم لكل متعلم.</div>", "x": "99e9ae75", "n": 1, "i": 46, "a": "tefl-62-033"}, {"t": "section", "h": "One lesson, many roles | حصة واحدة أدوار كتير", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">One lesson, many roles. Sometimes many of these skills are required in a single lesson.</div><div class=\"u\">حصة واحدة، أدوار كتير. أحيانًا مهارات كتير من دي بتتطلب في حصة واحدة.</div>", "x": "34485707", "n": 1, "i": 48, "a": "tefl-62-034"}, {"t": "learn", "h": "<div class=\"u\">The ability to seamlessly multi-task makes your lessons more fluid, more effective and more enjoyable.</div><div class=\"u\">القدرة على تعدّد المهام بسلاسة بتخلّي حصصك أكثر سلاسة وتأثيرًا ومتعة.</div>", "x": "6c95621c", "n": 1, "i": 49, "a": "tefl-62-035"}, {"t": "learn", "h": "<div class=\"u\">You may have picked up some of these skills in another job; that experience will serve you well.</div><div class=\"u\">ممكن تكون اكتسبت شوية من المهارات دي في شغلانة تانية؛ الخبرة دي هتفيدك كويس.</div>", "x": "1dc90835", "n": 1, "i": 50, "a": "tefl-62-036"}, {"t": "learn", "h": "<div class=\"u\">If not, delve into these areas before your first post: this course helps with some, friends can help with others, and a good book on management skills helps too.</div><div class=\"u\">ولو لأ، اتعمّق في المجالات دي قبل أول تعيين: الكورس ده بيساعد في بعضها، والأصحاب يقدروا يساعدوا في الباقي، وكتاب كويس عن مهارات الإدارة بيساعد كمان.</div>", "x": "58898bd2", "n": 1, "i": 51, "a": "tefl-62-037"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">assessor: the teacher who measures progress and grades.</div><div class=\"u\">المقيّم: المدرس اللي بيقيس التقدّم والدرجات.</div>", "x": "487f0cd4", "n": 1, "i": 53, "a": "tefl-62-038"}, {"t": "learn", "h": "<div class=\"u\">controller: the teacher keeping the class tuned and ordered.</div><div class=\"u\">المتحكّم: المدرس اللي بيحافظ على التركيز والنظام.</div>", "x": "2bed6058", "n": 1, "i": 54, "a": "tefl-62-039"}, {"t": "learn", "h": "<div class=\"u\">facilitator: the teacher who steps back so students learn by doing.</div><div class=\"u\">الميسّر: المدرس اللي بيتراجع عشان الطلبة تتعلّم بالعمل.</div>", "x": "f77c35ee", "n": 1, "i": 55, "a": "tefl-62-040"}, {"t": "learn", "h": "<div class=\"u\">guide: the teacher showing unsure students the way.</div><div class=\"u\">المرشد: المدرس اللي بيورّي الطريق للمحتارين.</div>", "x": "f203bd3c", "n": 1, "i": 56, "a": "tefl-62-041"}, {"t": "learn", "h": "<div class=\"u\">manager: the teacher running instructions, seating and routines.</div><div class=\"u\">المدير: المدرس اللي بيدير التعليمات والقعدة والروتين.</div>", "x": "2e2b2d18", "n": 1, "i": 57, "a": "tefl-62-042"}, {"t": "learn", "h": "<div class=\"u\">realia: real objects brought into class as material.</div><div class=\"u\">الأشياء الحقيقية: حاجات حقيقية بتتجاب الفصل كخامة.</div>", "x": "df916e21", "n": 1, "i": 58, "a": "tefl-62-043"}, {"t": "learn", "h": "<div class=\"u\">monitor: the teacher observing interactions and giving feedback.</div><div class=\"u\">المراقب: المدرس اللي بيلاحظ التفاعلات وبيدّي تغذية راجعة.</div>", "x": "6d860f36", "n": 1, "i": 59, "a": "tefl-62-044"}, {"t": "learn", "h": "<div class=\"u\">motivator: the teacher who keeps tired students going.</div><div class=\"u\">المحفّز: المدرس اللي بيشغّل الطلبة التعبانين.</div>", "x": "63a265b9", "n": 1, "i": 60, "a": "tefl-62-045"}, {"t": "learn", "h": "<div class=\"u\">needs analyst: the teacher identifying what learners need.</div><div class=\"u\">محلّل الاحتياجات: المدرس اللي بيحدّد احتياج المتعلمين.</div>", "x": "14e33afa", "n": 1, "i": 61, "a": "tefl-62-046"}, {"t": "learn", "h": "<div class=\"u\">multi-tasking: doing several roles at once, seamlessly.</div><div class=\"u\">تعدّد المهام: أدوار كتير في نفس الوقت بسلاسة.</div>", "x": "2109db88", "n": 1, "i": 62, "a": "tefl-62-047"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">A teacher is far more than a deliverer of information; the extra roles come with the job.</div><div class=\"u\">المدرس أكبر بكتير من ناقل معلومات؛ الأدوار الإضافية جزء من الشغلانة.</div>", "x": "ab960e90", "n": 1, "i": 64, "a": "tefl-62-048"}, {"t": "write", "q": "Which three roles do you expect to use most, and why? (3-4 sentences)<br>أنهي تلات أدوار متوقّع تستخدمهم أكتر، وليه؟ (٣-٤ جمل).", "key": "tefl-62:1", "a": "I expect to live mostly in the facilitator role, stepping back so students find their own way while I monitor and motivate. The planner-organiser will take my evenings, because maximum interaction and authentic language use do not happen by accident. And the monitor will never switch off: I will watch daily interactions, note common errors, and turn them into the next feedback session. The other roles will visit when the moment calls them.<br>متوقّع أعيش أغلب الوقت في دور الميسّر، بتراجع عشان الطلبة يلاقوا طريقهم وأنا براقب وبحفّز. المخطّط والمنظّم هياخد لياليّ، لأن أقصى تفاعل واستخدام لغة حقيقي مابيحصلوش صدفة. والمراقب مش هيتقفل أبدًا: هلاحظ التفاعلات اليومية، وأسجّل الأغلاط الشائعة، وأحوّلها لجلسة التغذية الراجعة الجاية. الأدوار التانية هتزور لما اللحظة تناديها.", "h": "", "n": 1, "i": 65}, {"t": "learn", "h": "<div class=\"u\">Ten roles: assessor, controller, facilitator, guide, manager, materials producer, monitor, motivator, needs analyst, planner.</div><div class=\"u\">عشر أدوار: مقيّم ومتحكّم وميسّر ومرشد ومدير ومنتج خامات ومراقب ومحفّز ومحلّل احتياجات ومخطّط.</div>", "x": "18489267", "n": 1, "i": 66, "a": "tefl-62-049"}, {"t": "recall", "q": "Name all ten teacher roles.<br>اذكر أدوار المدرس العشرة.", "a": "Assessor, controller, facilitator, guide, manager, materials producer and collector, monitor, motivator, needs analyst, planner and organiser.<br>المقيّم، المتحكّم، الميسّر، المرشد، المدير، منتج وجامع الخامات، المراقب، المحفّز، محلّل الاحتياجات، المخطّط والمنظّم.", "h": "", "n": 1, "i": 67}, {"t": "learn", "h": "<div class=\"u\">The facilitator steps back; the controller steps in; knowing which one the moment needs is the skill.</div><div class=\"u\">الميسّر بيتراجع؛ المتحكّم بيتدخّل؛ معرفة أنهي واحد اللحظة محتاجاه هي المهارة.</div>", "x": "18a51959", "n": 1, "i": 68, "a": "tefl-62-050"}, {"t": "learn", "h": "<div class=\"u\">The whole person comes to school: motivation and counselling are teaching work too.</div><div class=\"u\">الإنسان كله بييجي المدرسة: التحفيز والاستشارة شغل تدريس كمان.</div>", "x": "db0c9e6e", "n": 1, "i": 69, "a": "tefl-62-051"}, {"t": "learn", "h": "<div class=\"u\">Multi-tasking across roles makes lessons fluid, effective and enjoyable; build these skills before your first post.</div><div class=\"u\">تعدّد المهام عبر الأدوار بيخلّي الحصص سلسة ومؤثرة وممتعة؛ ابني المهارات دي قبل أول تعيين.</div>", "x": "385c76cf", "n": 1, "i": 70, "a": "tefl-62-052"}, {"t": "tf", "q": "Seamless multi-tasking makes lessons more fluid, effective and enjoyable.<br>تعدّد المهام بسلاسة بيخلّي الحصص أكثر سلاسة وتأثير ومتعة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. The unit says exactly this. | غلط: الوحدة بتقول ده بالظبط."], "h": "", "n": 1, "i": 71}, {"t": "write", "q": "Why is the facilitator not just a lazy controller? (3-4 sentences)<br>ليه الميسّر مش متحكّم كسلان؟ (٣-٤ جمل).", "key": "tefl-62:2", "a": "The controller works to keep the whole class tuned in and ordered; the facilitator works just as hard in the opposite direction, stepping back on purpose. Facilitation means letting students find their own way along the language journey, which builds independence, while still monitoring and motivating as needed. The facilitator is not absent: he stays available and ready to act as a resource the moment he is needed. Choosing when to control and when to facilitate is itself the professional skill.<br>المتحكّم بيشتغل عشان يخلي الفصل مركّز ومنتظم؛ الميسّر بيشتغل بنفس الجهد في الاتجاه العكسي، بيتراجع بقصد. التيسير معناه سياب الطلبة يلاقوا طريقهم في رحلة اللغة، وده بيبني الاستقلالية، مع متابعة وتحفيز حسب الحاجة. الميسّر مش غايب: بيفضل متاح وجاهز يعمل كمصدر أول ما يتطلب. اختيار إمتى تتحكّم وإمتى تيسّر هو بحد ذاته المهارة المهنية.", "h": "", "n": 1, "i": 72}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 73}];</script>
