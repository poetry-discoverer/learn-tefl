<script>window.LESSON_ID="tefl-63";window.STEPS=[{"t": "section", "h": "Why indiscipline happens | ليه بيحصل شغب", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit four: discipline in the classroom. More movement and more communication in modern classrooms also means more potential for things to go wrong.</div><div class=\"u\">الوحدة الرابعة: الانضباط في الفصل. الحركة الزيادة والتواصل الزيادة في الفصول الحديثة معناهم كمان احتمال أكبر إن حاجات تبوظ.</div>", "x": "f6426859", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">Discipline and behaviour are the most frequently mentioned concerns of inexperienced teachers.</div><div class=\"u\">الانضباط والسلوك هما أكتر مخاوف بتتذكر من المدرسين الجداد.</div>", "x": "2113e765", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">Indiscipline often arises from confusion over weak classroom rules, or lack of them, and over roles and expectations, yours and your students'.</div><div class=\"u\">عدم الانضباط غالبًا بينشأ من لخبطة حوالين قواعد فصل ضعيفة أو معدومة، وحوالين الأدوار والتوقّعات، بتاعتك وبتاعة طلبتك.</div>", "x": "4290c4dd", "n": 1, "i": 3}, {"t": "tf", "q": "One reason indiscipline arises is confusion over weak classroom rules, or lack of them.<br>سبب من أسباب الشغب هو اللخبطة حوالين قواعد فصل ضعيفة أو معدومة.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Weak rules invite trouble. | غلط: القواعد الضعيفة بتستدعي المشاكل."], "h": "", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">In essence, inadequate classroom management is at the root of it, most of the time.</div><div class=\"u\">في الجوهر، إدارة الفصل الضعيفة هي جذر المشكلة، أغلب الوقت.</div>", "x": "99881909", "n": 1, "i": 5}, {"t": "section", "h": "Two attitudes | موقفين", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Two teacher attitudes to discipline. The first sees the learner as a passive recipient of information from the teacher, the fount of knowledge.</div><div class=\"u\">موقفين للمدرسين من الانضباط. الأول بيشوف المتعلم مستقبِل سلبي للمعلومات من المدرس، نبع المعرفة.</div>", "x": "414b8627", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">These teachers control, and accept minor punishments as an incentive to learning.</div><div class=\"u\">المدرسين دول بيتحكّموا، وبيقبلوا عقوبات صغيرة كحافز للتعلّم.</div>", "x": "5bc718b4", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">The second sees learning as a process requiring the active commitment of students.</div><div class=\"u\">التاني بيشوف التعلّم عملية محتاجة التزام نشط من الطلبة.</div>", "x": "9b5032fc", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">These teachers avoid punishment, rely on students' interest in the work, and act as guides, maintaining discipline through persuasion and the students' basic good nature.</div><div class=\"u\">المدرسين دول بيتجنّبوا العقاب، وبيتكلوا على اهتمام الطلبة بالشغل، وبيتصرفوا كمرشدين، بيحافظوا على الانضباط بالإقناع والطبيعة الطيبة الأساسية للطلبة.</div>", "x": "238d4f90", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Experience tells us: if you genuinely care for your students and communicate well with them, in subject content and socially, you will bring out their best.</div><div class=\"u\">التجربة بتقول: لو بتعتني بطلبتك بصدق وبتتواصل معاهم كويس، في المادة واجتماعيًا، هتطلّع أحسن ما فيهم.</div>", "x": "dfd5b52c", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">With these goals in sight, you will often get the better of even the most troublesome student. You will decide on your approach.</div><div class=\"u\">وبالأهداف دي قدّامك، غالبًا هتتغلّب حتى على أكثر طالب مزعج. انت اللي هتقرّر أسلوبك.</div>", "x": "2f7b3a53", "n": 1, "i": 12}, {"t": "section", "h": "Seven negative issues | سبع مشاكل سلبية", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Key issues that can affect student behaviour negatively. One: you try to be liked instead of respected.</div><div class=\"u\">مشاكل أساسية ممكن تأثّر على سلوك الطلبة سلبًا. واحد: بتحاول تبقى محبوب بدل محترم.</div>", "x": "1df0d9d7", "n": 1, "i": 14}, {"t": "recall", "q": "Name the seven key issues that affect student behaviour negatively.<br>اذكر المشاكل السبعة اللي بتأثّر على سلوك الطلبة سلبًا.", "a": "Wanting to be liked not respected; the urge to control rather than earn respect; no strategies for student-created problems; confusion over rules, roles and expectations; poor teacher-student communication; zero-tolerance policies; and no policies at all.<br>عايز تبقى محبوب مش محترم؛ غريزة التحكّم بدل كسب الاحترام؛ مفيش استراتيجيات لمشاكل الطلبة؛ لخبطة القواعد والأدوار والتوقّعات؛ تواصل ضعيف؛ سياسات صفر تسامح؛ ومفيش سياسات خالص.", "h": "", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Two: an innate urge among some teachers to control students rather than elicit their respect for authority.</div><div class=\"u\">اتنين: غريزة عند بعض المدرسين إنهم يتحكّموا في الطلبة بدل ما يكسبوا احترامهم للسلطة.</div>", "x": "feef6444", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Three: some teachers never develop effective strategies for dealing with unacceptable student-created problems.</div><div class=\"u\">تلاتة: بعض المدرسين أبدًا مابيطوّروا استراتيجيات مؤثرة للتعامل مع مشاكل الطلبة غير المقبولة.</div>", "x": "f5283db3", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Four: confusion over rules, roles and expectations, on both sides.</div><div class=\"u\">أربعة: لخبطة حوالين القواعد والأدوار والتوقّعات، عند الطرفين.</div>", "x": "58c7860a", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Five: poor teacher-student communication.</div><div class=\"u\">خمسة: تواصل ضعيف بين المدرس والطالب.</div>", "x": "37bd05b4", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Six: unbending school supervision and discipline policies, zero tolerance.</div><div class=\"u\">ستة: سياسات إشراف وانضباط مدرسية متصلّبة، صفر تسامح.</div>", "x": "01233d0e", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Seven: a lack of school supervision and discipline policies altogether.</div><div class=\"u\">سبعة: غياب سياسات الإشراف والانضباط المدرسية بالكامل.</div>", "x": "b0e948b0", "n": 1, "i": 21}, {"t": "section", "h": "Strategies 1-4 | استراتيجيات ١-٤", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Strategy one: good planning and organisation. The best disciplinarians are not those good at dealing with problems, but those who prevent them.</div><div class=\"u\">الاستراتيجية الأولى: تخطيط وتنظيم كويس. أحسن الناس في الانضباط مش اللي بيعرفوا يتعاملوا مع المشاكل، لكن اللي بيمنعوها.</div>", "x": "8bdb9d66", "n": 1, "i": 23}, {"t": "mc", "q": "The best disciplinarians are teachers who:<br>أحسن الناس في الانضباط هما المدرسين اللي:", "opts": ["prevent problems through planning and momentum | بيمنعوا المشاكل بالتخطيط والزخم", "punish every mistake instantly | بيعاقبوا كل غلطة فورًا", "ignore all minor issues | بيتجاهلوا كل المشاكل الصغيرة"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Prevention beats punishment. | غلط: المنع بيتغلّب على العقاب.", "No. Minor issues escalate. | غلط: المشاكل الصغيرة بتتصاعد."], "h": "", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Careful planning creates constant momentum, pace and purpose. No vacuum forms for counter-productive activity to fill.</div><div class=\"u\">التخطيط الدقيق بيخلق زخم وإيقاع وهدف مستمرين. مابيتكوّنش فراغ النشاط المعاكس يملاه.</div>", "x": "8fc23b4e", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Planning also builds your confidence and wins student trust. The misbehaver, ignored by a busy class, has no audience and gives up.</div><div class=\"u\">التخطيط كمان بيبني ثقتك وبيكسب ثقة الطلبة. المشاغب، المتجاهَل من فصل مشغول، ملوش جمهور فيبطّل.</div>", "x": "df89ecb9", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Strategy two: an English-only environment. Cultivate it as much as possible, so the class does not get side-tracked by L1 use, but allow some L1 occasions.</div><div class=\"u\">الاستراتيجية التانية: بيئة إنجليزي-بس. زرّعها بأكبر قدر ممكن، عشان الفصل مايتشتّتش باستخدام اللغة الأولى، بس اسمح ببعض المناسبات للغة الأولى.</div>", "x": "0298bbf1", "n": 1, "i": 27}, {"t": "tf", "q": "Cultivating an L1 environment keeps the class from being side-tracked by L2 use.<br>زراعة بيئة باللغة الأولى بتحمي الفصل من التشتّت باستخدام اللغة التانية.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. English-only is the goal. | غلط: إنجليزي-بس هو الهدف.", "Correct. | صح."], "h": "", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Strategy three: the skill of distraction. A prepared distraction closes the curtains on the misbehaving performer, almost guaranteed.</div><div class=\"u\">الاستراتيجية التالتة: مهارة التشتيت. تشتيت محضّر بيسدل الستارة على الممثّل المشاغب، مضمون تقريبًا.</div>", "x": "e29dbb90", "n": 1, "i": 29}, {"t": "tf", "q": "Creating a distraction is not a reliable way to stop a misbehaving performer.<br>خلق تشتيت مش طريقة موثوقة لإيقاف الممثّل المشاغب.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Distraction works. | غلط: التشتيت بيشتغل.", "Correct. | صح."], "h": "", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Examples: hands up who wants to see this amazing picture. First group to write these words as a sentence on the board gets ten points.</div><div class=\"u\">أمثلة: ارفعوا إيديكم مين عايز يشوف الصورة المدهشة دي. أول مجموعة تكتب الكلمات دي كجملة على السبورة تاخد عشر نقط.</div>", "x": "908b3b57", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Or: ah, I forgot the box! Who wants to be first to see what is in my box? Or whisper a message down the group. Or: who wants to hear something funny that happened to me yesterday?</div><div class=\"u\">أو: آه، نسيت العلبة! مين عايز يبقى أول واحد يشوف اللي في علبتي؟ أو اهمس رسالة تتنقل في المجموعة. أو: مين عايز يسمع حاجة مضحكة حصلت لي إمبارح؟</div>", "x": "a80195ba", "n": 1, "i": 32}, {"t": "learn", "h": "<div class=\"u\">He will want to be part of the new activity, like everyone else.</div><div class=\"u\">هيبقى عايز يشارك في النشاط الجديد، زي كل حد تاني.</div>", "x": "a9661006", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Strategy four: clear and succinct instructions. Too much hesitation and mind-changing easily distracts students.</div><div class=\"u\">الاستراتيجية الرابعة: تعليمات واضحة ومختصرة. التردد الزيادة وتغيير الرأي بيشتّت الطلبة بسهولة.</div>", "x": "78c81f8b", "n": 1, "i": 34}, {"t": "section", "h": "Strategies 5-10 | استراتيجيات ٥-١٠", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Strategy five: stay alert at all times, for negatives and positives. Keep your eyes and ears open in all sectors of the classroom.</div><div class=\"u\">الاستراتيجية الخامسة: خلّيك منتبه طول الوقت، للسلبي والإيجابي. خلّي عينيك وودانك مفتوحين على كل أجزاء الفصل.</div>", "x": "76a2d4eb", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Do not fall into the trap of using class time to mark previous work. That is a recipe for disaster. Your role is to facilitate learning at all times.</div><div class=\"u\">ماتقعش في فخ استخدام وقت الحصة في تصحيح شغل قديم. دي وصفة كارثة. دورك إنك تيسّر التعلّم طول الوقت.</div>", "x": "7a2361de", "n": 1, "i": 37}, {"t": "tf", "q": "When things are going well, use class time to mark previous work.<br>لما الأمور ماشية كويس، استخدم وقت الحصة في تصحيح شغل قديم.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Stay alert always. | غلط: خلّيك منتبه دايمًا.", "Correct. | صح."], "h": "", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Watch for positive behaviour too, and praise it specifically: well done group B, I noticed everyone is doing a separate part of the task; that is what group work is about.</div><div class=\"u\">راقب السلوك الإيجابي كمان، وامدحه بتحديد: أحسنت يا مجموعة ب، لاحظت إن كل واحد بيعمل جزء مختلف من المهمة؛ ده معنى شغل المجموعات.</div>", "x": "935ea083", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">And communicate with parents and carers: if school policy allows, send a termly note home about what students have done well. It is discussed at home and motivates further.</div><div class=\"u\">وتواصل مع الأهالي والقائمين على الرعاية: لو سياسة المدرسة بتسمح، ابعت جواب فصلي للبيت عن اللي الطلبة عملوه كويس. بيتتناقش في البيت وبتزوّد الدافع.</div>", "x": "b4098c1a", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Strategy six: set and agree a code of behaviour with the students, so they know the consequences, for homework, letting others speak, sticking to routines.</div><div class=\"u\">الاستراتيجية السادسة: حط واتّفق على ميثاق سلوك مع الطلبة، عشان يعرفوا العواقب، للواجب ولسياب التانيين يتكلّموا وللالتزام بالروتين.</div>", "x": "f90d17ab", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Be wise: present your own code of behaviour too, how you will behave at all times, patient, never shouting. This builds trust and respect.</div><div class=\"u\">كن حكيم: اعرض ميثاق سلوكك انت كمان، إزاي هتتصرّف طول الوقت، صبور ومابتصرّخش أبدًا. ده بيبني الثقة والاحترام.</div>", "x": "6af07aa5", "n": 1, "i": 42}, {"t": "tf", "q": "Be wise and present your own code of behaviour to the class too.<br>كن حكيم واعرض ميثاق سلوكك انت كمان على الفصل.", "ans": true, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "Wrong. Teachers model standards. | غلط: المدرسين بينمذجوا المعايير."], "h": "", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Strategy seven: fairness and consistency, at all times, with all students, even if the misbehaver is normally one of your best.</div><div class=\"u\">الاستراتيجية السابعة: عدل وثبات، طول الوقت، مع كل الطلبة، حتى لو المشاغب عادة من أحسن طلبتك.</div>", "x": "9804394a", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Strategy eight: focus on the behaviour, not on the person. Never comment on the person misbehaving; comment on the behaviour.</div><div class=\"u\">الاستراتيجية التامنة: ركّز على السلوك، مش على الشخص. أبدًا ماتعلّق على الشخص المشاغب؛ علّق على السلوك.</div>", "x": "fbb597f9", "n": 1, "i": 45}, {"t": "tf", "q": "Focus on the person, not on the behaviour.<br>ركّز على الشخص، مش على السلوك.", "ans": false, "why": "Correct. | صح.", "ex": ["Wrong. Behaviour, not person. | غلط: السلوك مش الشخص.", "Correct. | صح."], "h": "", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Strategy nine: encourage even your misbehaving students. When they behave well, catch them at it: well done Juan, you have some very good examples there.</div><div class=\"u\">الاستراتيجية التاسعة: شجّع حتى طلبتك المشاغبين. لما يتصرّفوا كويس، اقبضهم في الموقف: أحسنت يا خوان، عندك أمثلة كويسة جدًا هنا.</div>", "x": "c605cc76", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">Strategy ten: use your body language. Often there is no need to speak.</div><div class=\"u\">الاستراتيجية العاشرة: استخدم لغة جسمك. غالبًا مفيش داعي للكلام.</div>", "x": "b4a501aa", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">Most students stop misbehaving when you stare at length, clap once, shake your head no, or ring a bell agreed in the class rules.</div><div class=\"u\">أغلب الطلبة بيبطّلوا شغب لما تتحدّق طويلًا، أو تطبّل مرة، أو تهز راسك بلا، أو تدق جرس متّفق عليه في القواعد.</div>", "x": "e2afea19", "n": 1, "i": 49}, {"t": "section", "h": "Strategies 11-17 | استراتيجيات ١١-١٧", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Strategy eleven: get them up and moving. Build movement into lessons, roleplays, changing places, part of the lesson outside.</div><div class=\"u\">الاستراتيجية الحداشر: قوّمهم وحرّكهم. ابني حركة جوّه الحصص، لعب أدوار، تبديل أماكن، جزء من الحصة برّه.</div>", "x": "183456e0", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">A lethargic environment, students sitting still lesson after lesson, is a ripe environment for misdemeanours.</div><div class=\"u\">البيئة الخاملة، طلبة قاعدين ساكنين حصة ورا حصة، بيئة ناضجة للمخالفات.</div>", "x": "3b576a95", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">Strategy twelve: keep up the pace. Breaks and lulls in the pace are ripe environments for misbehaviour too.</div><div class=\"u\">الاستراتيجية الاتناشر: حافظ على الإيقاع. الوقفات والفترات الفاضية في الإيقاع بيئات ناضجة للشغب كمان.</div>", "x": "9c1fe8c5", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">They can come from technology issues or too long with one group. Plan quick, meaningful activities for those gaps.</div><div class=\"u\">ممكن تيجي من مشاكل تكنولوجيا أو وقت طويل مع مجموعة واحدة. خطّط أنشطة سريعة ذات معنى للفجوات دي.</div>", "x": "0e96f59a", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">Strategy thirteen: do not ignore minor issues. Inexperienced teachers ignore them hoping they vanish; occasionally they do, but more often they escalate. Respond immediately and actively.</div><div class=\"u\">الاستراتيجية التالتاشر: ماتتجاهلش المشاكل الصغيرة. المدرسين الجداد بيتجاهلوها على أمل إنها تختفي؛ أحيانًا بتختفي، بس غالبًا بتتصاعد. رد فورًا وبنشاط.</div>", "x": "0fb1728e", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Strategy fourteen: deal with it quietly. The best action is a quiet but clear-cut response that stops the activity.</div><div class=\"u\">الاستراتيجية الاربعتاشر: اتعامل بهدوء. أحسن تصرّف هو رد هادي بس حاسم بيوقّف النشاط.</div>", "x": "4c29daa2", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">Strategy fifteen: move students. Ensure potentially disruptive students sit at the front, close to you.</div><div class=\"u\">الاستراتيجية الخمستاشر: حرّك الطلبة. خلّي الطلبة المحتمل إزعاجهم قاعدين في أول الفصل، قريب منك.</div>", "x": "bc2e5547", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">Strategy sixteen: stay close to them. Move towards a persistent student and ask if you can help; then walk away with a smile and a well done.</div><div class=\"u\">الاستراتيجية الستاشر: خلّيك قريب منهم. اتحرّك ناحية الطالب المصرّ واسأله لو محتاج مساعدة؛ وبعدين ابعد بابتسامة وأحسنت.</div>", "x": "1aa2b61b", "n": 1, "i": 58}, {"t": "mc", "q": "A student keeps disrupting from the back row. The strategies suggest:<br>طالب بيعمل إزعاج متكرر من الصف الأخير. الاستراتيجيات بتقترح:", "opts": ["move him to the front and stay close to him | تنقله للقدّام وتفضل قريب منه", "send him out for the whole term | تطرده طول الترم", "threaten him with expulsion | تهدّده بالفصل"], "ans": 0, "why": "Correct. | صح.", "ex": ["Correct. | صح.", "No. Exclusion is not a strategy here. | غلط: الاستبعاد مش استراتيجية هنا.", "No. Threats backfire. | غلط: التهديدات بتضرب في صاحبها."], "h": "", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Or sit down close to disruptive students and carry on the lesson from there. They will stop when you are up close and personal.</div><div class=\"u\">أو اقعد جنب الطلبة المشاغبين وكمّل الحصة من هناك. هيبطّلوا لما تبقى قريب وشخصي.</div>", "x": "5c451a13", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Strategy seventeen: do not use threats. Threats exacerbate the problem, especially threats you will not implement.</div><div class=\"u\">الاستراتيجية السبتاشر: ماتستخدمش التهديدات. التهديدات بتزوّد المشكلة، خصوصًا التهديدات اللي مش هتنفّذها.</div>", "x": "5e1200b1", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Students work it out: nothing happened last time, so why will it happen this time? And they take their misbehaviour to the brink.</div><div class=\"u\">الطلبة بتحسبها: ماحصلش حاجة المرة اللي فاتت، ليه هتحصل المرة دي؟ وبيوصّلوا شغبهم للحرف.</div>", "x": "ae5f9c45", "n": 1, "i": 62}, {"t": "section", "h": "Strategies 18-19 | استراتيجيات ١٨-١٩", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">Strategy eighteen: never lose your temper. Losing your temper can be disastrous, especially in cultures where showing strong negative emotion is among the worst things you can do.</div><div class=\"u\">الاستراتيجية التمنتاشر: أبدًا ماتفقد أعصابك. فقدان الأعصاب ممكن يبقى كارثي، خصوصًا في ثقافات إظهار الانفعال السلبي القوي فيها من أسوأ الحاجات.</div>", "x": "1a5d6f71", "n": 1, "i": 64}, {"t": "learn", "h": "<div class=\"u\">Instead: approach the offender and tell him he needs to stop, confidently but without shouting.</div><div class=\"u\">بدلها: اقترِب من المخطئ وقوله إنه محتاج يبطّل، بثقة بس من غير صريخ.</div>", "x": "a356d258", "n": 1, "i": 65}, {"t": "learn", "h": "<div class=\"u\">Pause, keeping full and confident eye contact, showing you expect him to stop. Repeat if he does not stop immediately. This calm approach works in most cases.</div><div class=\"u\">وقّف، مع تواصل بصري كامل وواثق، بيبيّن إنك متوقّع إنه يبطّل. كرّر لو مابطّلش فورًا. الأسلوب الهادي ده بيشتغل في أغلب الحالات.</div>", "x": "349d424c", "n": 1, "i": 66}, {"t": "learn", "h": "<div class=\"u\">Strategy nineteen: dealing with serious incidents. They will be few and far between, if ever, but have a strategy.</div><div class=\"u\">الاستراتيجية التسعتاشر: التعامل مع الحوادث الجدّية. هتبقى نادرة جدًا، لو حصلت أصلًا، بس خلّي عندك استراتيجية.</div>", "x": "7c0caab2", "n": 1, "i": 67}, {"t": "learn", "h": "<div class=\"u\">First: remember the whole person comes to school. Has something happened externally, at home? Take a moment to consider this.</div><div class=\"u\">أولًا: افتكر إن الإنسان كله بييجي المدرسة. حصل حاجة برّه، في البيت؟ خد لحظة تفكّر في ده.</div>", "x": "6f56b212", "n": 1, "i": 68}, {"t": "learn", "h": "<div class=\"u\">Speak loudly but do not shout. Do not go down the argument track; stop and go silent. Remember you have a class to look after.</div><div class=\"u\">اتكلّم بصوت عالي بس ماتصرّخش. ماتدخلش في تراك الجدال؛ وقّف واسكت. افتكر إن عندك فصل تهتم بيه.</div>", "x": "20def370", "n": 1, "i": 69}, {"t": "learn", "h": "<div class=\"u\">Offer, with empathy, the chance to take time out in the fresh air and then return to class. Then get the class back on track.</div><div class=\"u\">اعرض، بتعاطف، فرصة ياخد وقت مستقطع في هوا نضيف وبعدين يرجع الفصل. وبعدين رجّع الفصل لمساره.</div>", "x": "56a2f976", "n": 1, "i": 70}, {"t": "learn", "h": "<div class=\"u\">Afterwards: arrange a later meeting, emphasising it is not about discipline, to find the root cause and help the student move on positively. You may still impose a sanction in line with the rules.</div><div class=\"u\">بعدها: رتّب اجتماع لاحق، مؤكّد إنه مش عن الانضباط، عشان تلاقي السبب الجذري وتساعد الطالب يتحرّك بإيجابية. ممكن لسه تفرض عقوبة حسب القواعد.</div>", "x": "44672fa7", "n": 1, "i": 71}, {"t": "learn", "h": "<div class=\"u\">For very serious actions, like threatening other students or vandalising property, alert your Head of Department or Director of Studies as soon as the lesson ends.</div><div class=\"u\">للتصرّفات الجدّية جدًا، زي تهديد طلبة تانيين أو تخريب ممتلكات، بلّغ رئيس القسم أو مدير الدراسات أول ما الحصة تخلّص.</div>", "x": "2a7e905c", "n": 1, "i": 72}, {"t": "learn", "h": "<div class=\"u\">Seek advice and be guided on the best route. Never feel afraid or weak about asking for help.</div><div class=\"u\">اطلب نصيحة وخد توجيه لأحسن طريق. أبدًا ماتخافش أو تحس بضعف إنك تطلب مساعدة.</div>", "x": "2c164bf7", "n": 1, "i": 73}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">indiscipline: behaviour that breaks the class's rules.</div><div class=\"u\">عدم الانضباط: سلوك بيكسر قواعد الفصل.</div>", "x": "d7e90438", "n": 1, "i": 75}, {"t": "learn", "h": "<div class=\"u\">code of behaviour: agreed rules for everyone, teacher included.</div><div class=\"u\">ميثاق السلوك: قواعد متّفق عليها للكل، المدرس كمان.</div>", "x": "d9da681f", "n": 1, "i": 76}, {"t": "learn", "h": "<div class=\"u\">distraction technique: a prepared surprise that stops misbehaviour.</div><div class=\"u\">تقنية التشتيت: مفاجأة محضّرة بتوقّف الشغب.</div>", "x": "e29bc2d7", "n": 1, "i": 77}, {"t": "recall", "q": "Name six of the nineteen discipline strategies.<br>اذكر ستة من استراتيجيات الانضباط التسعتاشر.", "a": "Any six of: planning and momentum; English-only environment; the distraction technique; clear succinct instructions; staying alert for negatives and positives; an agreed code of behaviour; fairness and consistency; behaviour not person; encouraging misbehaving students; body language; movement; pace; not ignoring minor issues; quiet responses; front seating; proximity; no threats; never losing your temper; the serious-incident procedure.<br>أي ستة من: التخطيط والزخم؛ بيئة إنجليزي-بس؛ تقنية التشتيت؛ تعليمات واضحة مختصرة؛ الانتباه للسلبي والإيجابي؛ ميثاق سلوك متّفق عليه؛ عدل وثبات؛ السلوك مش الشخص؛ تشجيع المشاغبين؛ لغة الجسم؛ الحركة؛ الإيقاع؛ عدم تجاهل الصغائر؛ ردود هادية؛ قعدة قدّام؛ القرب؛ مفيش تهديدات؛ مفيش فقدان أعصاب؛ إجراء الحوادث الجدّية.", "h": "", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">momentum: the constant pace and purpose of a lesson.</div><div class=\"u\">الزخم: الإيقاع والهدف المستمر للحصة.</div>", "x": "46a8199e", "n": 1, "i": 79}, {"t": "learn", "h": "<div class=\"u\">vacuum: a dead gap where misbehaviour grows.</div><div class=\"u\">الفراغ: فجوة ميتة الشغب بيكبر فيها.</div>", "x": "0d0a19da", "n": 1, "i": 80}, {"t": "learn", "h": "<div class=\"u\">L1: the students' first language.</div><div class=\"u\">اللغة الأولى: لغة الطلبة الأم.</div>", "x": "9eccf258", "n": 1, "i": 81}, {"t": "learn", "h": "<div class=\"u\">time out: a short break away from the class to calm down.</div><div class=\"u\">الوقت المستقطع: استراحة قصيرة برّه الفصل للهدوء.</div>", "x": "c6705763", "n": 1, "i": 82}, {"t": "learn", "h": "<div class=\"u\">sanction: a consequence applied under the rules.</div><div class=\"u\">العقوبة: نتيجة بتتطبّق حسب القواعد.</div>", "x": "e1bd1505", "n": 1, "i": 83}, {"t": "learn", "h": "<div class=\"u\">zero tolerance: a policy with no exceptions at all.</div><div class=\"u\">صفر تسامح: سياسة بلا أي استثناءات.</div>", "x": "2f6478ba", "n": 1, "i": 84}, {"t": "write", "q": "A new class is starting to test you. What do you do in week one? (3-4 sentences)<br>فصل جديد بدأ يختبرك. تعمل إيه في الأسبوع الأول؟ (٣-٤ جمل).", "key": "tefl-63:1", "a": "I would prevent before I cure: lessons planned with momentum and purpose, so no vacuum opens for misbehaviour to fill. I would agree a code of behaviour with the class, and present my own code too, patient and never shouting, because that builds trust. My instructions would be clear and succinct, and I would stay alert, praising specific good behaviour as much as watching for problems. For the first testing behaviours, I would answer quietly, with body language and proximity, focusing on the behaviour, never the person.<br>همنع قبل ما أعالج: حصص متخطّطة بزخم وهدف، عشان ميتفتحش فراغ الشغب يملاه. هتّفق على ميثاق سلوك مع الفصل، وهعرض ميثاقي أنا كمان، صبور ومابصرّخش، لأن ده بيبني الثقة. تعليماتي هتبقى واضحة ومختصرة، وهفضل منتبه، بامدح السلوك الكويس المحدّد بقدر ما براقب المشاكل. لأول سلوكيات الاختبار، هرد بهدوء، بلغة الجسم والقرب، مركّز على السلوك، ماش الشخص.", "h": "", "n": 1, "i": 85}, {"t": "learn", "h": "<div class=\"u\">escalate: a small problem growing into a bigger one.</div><div class=\"u\">التصعيد: مشكلة صغيرة بتكبر.</div>", "x": "0143ff70", "n": 1, "i": 86}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 87}, {"t": "learn", "h": "<div class=\"u\">Indiscipline usually grows from weak rules, confused roles and inadequate classroom management.</div><div class=\"u\">عدم الانضباط غالبًا بيكبر من قواعد ضعيفة وأدوار ملخبطة وإدارة فصل ضعيفة.</div>", "x": "e2177fc7", "n": 1, "i": 88}, {"t": "learn", "h": "<div class=\"u\">Choose your attitude: the punishing controller or the persuading guide; genuine care brings out students' best.</div><div class=\"u\">اختار موقفك: المتحكّم المعاقِب أو المرشد المقنِع؛ الاهتمام الصادق بيطلّع أحسن ما في الطلبة.</div>", "x": "8b20078b", "n": 1, "i": 89}, {"t": "learn", "h": "<div class=\"u\">Prevent first: momentum, clear instructions, movement and pace leave no vacuum for misbehaviour.</div><div class=\"u\">امنع الأول: الزخم والتعليمات الواضحة والحركة والإيقاع مابيسيّبوش فراغ للشغب.</div>", "x": "a4c559c9", "n": 1, "i": 90}, {"t": "learn", "h": "<div class=\"u\">Correct wisely: quiet responses, behaviour not person, specific praise, proximity, no threats, no lost temper.</div><div class=\"u\">صحّح بذكاء: ردود هادية، السلوك مش الشخص، مدح محدّد، قرب، مفيش تهديدات، مفيش فقدان أعصاب.</div>", "x": "6970be10", "n": 1, "i": 91}, {"t": "learn", "h": "<div class=\"u\">For serious incidents: calm, empathy, time out, a later root-cause meeting, and senior support for the very serious.</div><div class=\"u\">للحوادث الجدّية: هدوء وتعاطف ووقت مستقطع واجتماع لاحق للسبب الجذري، ودعم الإدارة للأكثر جدية.</div>", "x": "a440c220", "n": 1, "i": 92}, {"t": "write", "q": "Why are threats and lost tempers losing strategies? (3-4 sentences)<br>ليه التهديدات وفقدان الأعصاب استراتيجيات خسرانة؟ (٣-٤ جمل).", "key": "tefl-63:2", "a": "Threats exacerbate the problem, especially threats you will not implement; students quickly work out that nothing happened last time, so nothing will happen this time, and they push to the brink. Losing your temper can be disastrous, and in some cultures showing strong negative emotion is among the worst things you can do. The alternative is stronger: approach the student, say calmly and confidently that the behaviour must stop, hold full eye contact, and repeat. Calm and confident wins most cases, and keeps your authority intact.<br>التهديدات بتزوّد المشكلة، خصوصًا التهديدات اللي مش هتنفّذها؛ الطلبة بسرعة بتحسب إن ماحصلش حاجة المرة اللي فاتت، فمش هتحصل المرة دي، وبيوصّلوا للحرف. فقدان الأعصاب ممكن يبقى كارثي، وفي ثقافات معينة إظهار الانفعال السلبي القوي من أسوأ الحاجات. البديل أقوى: اقترِب من الطالب، قول بهدوء وثقة إن السلوك لازم يقف، حافظ على تواصل بصري كامل، وكرّر. الهادي والواثق بيكسب أغلب الحالات، وبيحافظ على سلطتك سليمة.", "h": "", "n": 1, "i": 93}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the next unit.</div><div class=\"u\">الدرس الجاي: الوحدة الجاية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 94}];</script>
